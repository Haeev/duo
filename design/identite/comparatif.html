<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Duo · comparatif des trois pistes</title>
<link rel="stylesheet" href="node_modules/@fontsource-variable/dm-sans/standard.css">
<link rel="stylesheet" href="node_modules/@fontsource-variable/fraunces/full.css">
<link rel="stylesheet" href="node_modules/@fontsource-variable/jost/wght.css">
<link rel="stylesheet" href="node_modules/@fontsource-variable/bricolage-grotesque/standard.css">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 560px; overflow: hidden; }
body { background: #262626; color: #F2F2F2; font-family: 'DM Sans Variable', sans-serif; padding: 30px 48px 0; }
h1 { margin: 0 0 22px; font-size: 26px; font-weight: 600; letter-spacing: .01em; }
h1 span { color: #BDBDBD; font-weight: 400; }
.pistes { display: grid; grid-template-columns: repeat(3, 592px); gap: 24px; }
figure { margin: 0; }
img { display: block; width: 592px; height: 333px; box-shadow: 0 0 0 1px #4A4A4A; }
figcaption { padding-top: 14px; }
figcaption b { display: block; font-size: 30px; line-height: 1.1; }
figcaption span { display: block; font-size: 16px; color: #CFCFCF; margin-top: 6px; }
.a b { font-family: 'Fraunces Variable', serif; font-variation-settings: 'SOFT' 100, 'WONK' 1; font-weight: 800; }
.b b { font-family: 'Jost Variable', sans-serif; font-weight: 400; }
.c b { font-family: 'Bricolage Grotesque Variable', sans-serif; font-weight: 800; font-stretch: 75%; text-transform: uppercase; }
</style>
</head>
<body>
<h1>Duo · trois pistes d'identité visuelle <span>· planches complètes dans design/identite/piste-a.png, piste-b.png, piste-c.png</span></h1>
<div class="pistes">
  <figure class="a"><img src="piste-a.png" alt="Planche de la piste A"><figcaption><b>A · Boîte à jeux</b><span>chaleureuse, tactile, familière · clair, carton et pions</span></figcaption></figure>
  <figure class="b"><img src="piste-b.png" alt="Planche de la piste B"><figcaption><b>B · Étoile double</b><span>calme, nocturne, complice · sombre, traits fins et astres</span></figcaption></figure>
  <figure class="c"><img src="piste-c.png" alt="Planche de la piste C"><figcaption><b>C · Deux encres</b><span>franche, graphique, vive · papier, noir et deux encres</span></figcaption></figure>
</div>
</body>
</html>
