<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Duo · couleurs et symboles des joueurs · contrôle</title>
<link rel="stylesheet" href="../node_modules/@fontsource-variable/jost/wght.css">
<link rel="stylesheet" href="../node_modules/@fontsource-variable/dm-sans/standard.css">
<link rel="stylesheet" href="../jetons.css">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 1600px; }
body { background: var(--color-bg); color: var(--color-text); font-family: var(--font-text); font-size: 16px; padding: 36px 44px 30px; }
h1 { font: var(--type-title-2-weight) var(--type-title-2-size)/var(--type-title-2-line-height) var(--font-display); margin: 0 0 4px; }
.sous { color: var(--color-text-muted); margin: 0 0 22px; }
.bandes { display: grid; gap: 12px; margin-bottom: 26px; }
.bande { display: grid; grid-template-columns: 150px repeat(6, 1fr); align-items: center; border-radius: var(--radius-large); padding: 14px 18px; }
.bande > b { font: 500 14px/1.3 var(--font-display); letter-spacing: .2em; text-transform: uppercase; color: var(--color-text-muted); }
.bande > b small { display: block; letter-spacing: 0; text-transform: none; font: 500 13px var(--font-text); margin-top: 4px; }
.profil { display: flex; align-items: center; gap: 10px; }
.profil .tailles { display: flex; align-items: center; gap: 8px; }
.profil .nom { font-size: 14px; line-height: 1.3; }
.profil .nom b { display: block; font-size: 15px; }
.profil .nom code { font: 500 13px var(--font-text); color: var(--color-text-muted); }
h2 { font: 500 14px/1 var(--font-display); letter-spacing: .24em; text-transform: uppercase; color: var(--color-text-muted); margin: 0 0 12px; }
.paires { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
.paire { background: var(--color-surface); box-shadow: var(--elevation-1); border-radius: var(--radius-medium); padding: 12px 14px; display: flex; gap: 14px; align-items: center; }
.paire .duo { display: flex; gap: 6px; flex: none; }
.paire .chiffres { font-size: 13px; line-height: 1.45; color: var(--color-text-muted); font-variant-numeric: tabular-nums; }
.paire .chiffres b { color: var(--color-text); font-weight: 600; }
.pied { margin-top: 16px; font-size: 13px; color: var(--color-text-muted); }
</style>
</head>
<body>
<h1>Couleurs et symboles des joueurs</h1>
<p class="sous">Six profils, chacun une couleur et un symbole. Jeton de 64 px avec halo, puis symbole seul en 32, 24 et 16 px, sur les trois fonds de l'interface.</p>
<div class="bandes" id="bandes"></div>
<h2>Les 15 paires · ΔE2000 en vision normale (N), protanopie (P), deutéranopie (D), tritanopie (T)</h2>
<div class="paires" id="paires"></div>
<p class="pied" id="pied"></p>
<script src="commun.js"></script>
<script>
(async () => {
  const { players } = await Duo.json('../joueurs.json');
  const mesures = await Duo.json('../controles/mesures.json');
  const fonds = [['bg', 'nuit', 'fond'], ['surface', 'surface', 'cartes'], ['surface-raised', 'surface haute', 'survol, menus']];
  const bandes = document.getElementById('bandes');
  for (const [jeton, nom, role] of fonds) {
    const el = document.createElement('div');
    el.className = 'bande';
    el.style.background = `var(--color-${jeton})`;
    el.innerHTML = `<b>${nom}<small>${role}</small></b>` + players.map((p) => `<div class="profil">${Duo.jeton(p, 64)}<div><div class="tailles">${Duo.jeton(p, 32, { halo: false })}${Duo.jeton(p, 24)}${Duo.jeton(p, 16)}</div><div class="nom"><b>${p.label}</b><code>${p.color}</code></div></div></div>`).join('');
    bandes.appendChild(el);
  }
  const parId = Object.fromEntries(players.map((p) => [p.id, p]));
  document.getElementById('paires').innerHTML = mesures.players.pairs.map((r) => `<div class="paire"><div class="duo">${Duo.jeton(parId[r.a], 40)}${Duo.jeton(parId[r.b], 40)}</div><div class="chiffres"><b>${parId[r.a].label} / ${parId[r.b].label}</b><br>N ${Duo.fr(r.normale)} · P ${Duo.fr(r.protanopie)} · D ${Duo.fr(r.deuteranopie)} · T ${Duo.fr(r.tritanopie)}</div></div>`).join('');
  const w = mesures.players.worst;
  document.getElementById('pied').textContent = `Seuils de CA-PF-109: 20 en vision normale, 10 après simulation (Machado 2009, sévérité 1). Pires paires: normale ${Duo.fr(w.normale.value)}, protanopie ${Duo.fr(w.protanopie.value)}, deutéranopie ${Duo.fr(w.deuteranopie.value)}, tritanopie ${Duo.fr(w.tritanopie.value)}. Calcul: outils/controler.cjs, sur joueurs.json.`;
  window.planchePrete = true;
})();
</script>
</body>
</html>
