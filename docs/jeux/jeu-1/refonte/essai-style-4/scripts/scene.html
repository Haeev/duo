<script type="module">
// Planche de l'essai 4 (style « bande dessinée encrée », bible 0.2, consignes du client du 2026-11-10).
// Un nuanceur encré pour tout (personnages, décor instancié, sol): ombre teintée, hachures ancrées à l'objet et
// d'épaisseur constante à l'écran, liseré clair côté soleil, ombre portée nette, relief tiré de la carte de
// hauteur des atlas (canal alpha), coque d'encre cuite dans la géométrie, vignette dans le matériau.
// Lisibilité: les niveaux de mip 2 et suivants des atlas sont des aplats sans trait; hachures et traits du
// visage fondent avec la distance. `?vue=<nom>` rend une seule case en grand (réglages).
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';

const ESSAI = '/docs/jeux/jeu-1/refonte/essai-style-4/';
const ESSAI3 = '/docs/jeux/jeu-1/refonte/essai-style-3/';
const params = new URLSearchParams(location.search);
const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
renderer.autoClear = false;
renderer.info.autoReset = false;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();

// Un seul soleil: il donne la direction de la rampe et la carte d'ombre. Les tons viennent des uniformes.
const sun = new THREE.DirectionalLight(0xffffff, 1);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -11, right: 11, top: 11, bottom: -11, near: 1, far: 44 });
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 0.014;
scene.add(sun, sun.target);

const V3 = (r, g, b) => new THREE.Vector3(r, g, b);
const AMBIANCES = {
  jour: { fond: 0x1d2419, lit: V3(1.0, 0.95, 0.84), mul: V3(0.34, 0.29, 0.44), add: V3(0.004, 0.002, 0.010), rim: V3(0.30, 0.26, 0.12), dir: [-0.75, 1.0, 0.55], vig: 0.6, lampe: 0, encre: 0x1c1512 },
  crepuscule: { fond: 0x2a1c2a, lit: V3(1.10, 0.66, 0.38), mul: V3(0.30, 0.20, 0.46), add: V3(0.022, 0.006, 0.040), rim: V3(0.55, 0.26, 0.06), dir: [-1.0, 0.42, -0.12], vig: 0.55, lampe: 0.35, encre: 0x1a1018 },
  nuit: { fond: 0x0b0e18, lit: V3(0.30, 0.40, 0.66), mul: V3(0.085, 0.12, 0.27), add: V3(0.003, 0.006, 0.022), rim: V3(0.10, 0.16, 0.30), dir: [0.55, 1.0, 0.35], vig: 0.7, lampe: 1, encre: 0x070912 },
};
const U = {
  uRes: { value: new THREE.Vector2(W, H) }, uView: { value: new THREE.Vector4(0, 0, W, H) }, uPx: { value: 3.0 },
  uInk: { value: new THREE.Color(0x1c1512) }, uLit: { value: V3(1, 1, 1) }, uShadeMul: { value: V3(0.4, 0.4, 0.6) },
  uShadeAdd: { value: V3(0, 0, 0) }, uRim: { value: V3(0.2, 0.2, 0.1) }, uVig: { value: 0.3 },
  uDetail: { value: 1 }, uHatchPx: { value: 5.0 }, uBias: { value: -1.0 },
  uLampPos: { value: V3(0, 0, 0) }, uLampCol: { value: V3(2.1, 1.3, 0.55) }, uLampR: { value: 3.6 }, uLampOn: { value: 0 },
};
const LAMPE = new THREE.Vector3(1.9, 1.55, 1.05);   // lanterne du piquet, au bord du chemin
function setAmbiance(name) {
  const a = AMBIANCES[name];
  sun.position.set(...a.dir).normalize().multiplyScalar(18);
  scene.background = new THREE.Color(a.fond);
  U.uInk.value.set(a.encre);
  U.uLit.value.copy(a.lit); U.uShadeMul.value.copy(a.mul); U.uShadeAdd.value.copy(a.add); U.uRim.value.copy(a.rim);
  U.uVig.value = a.vig; U.uLampOn.value = a.lampe;
  if (lanternGlass) lanternGlass.material.color.set(a.lampe > 0.2 ? 0xffe2a0 : 0x8a7a55);
  if (halo) { halo.visible = a.lampe > 0.2; halo.material.opacity = 0.5 * a.lampe; }
  for (const m of canopy) m.visible = name === 'jour';   // soleil rasant ou lune: l'ombre de l'arbre sort du cadre
}
let lanternGlass = null, halo = null;
const canopy = [];

// ---------------------------------------------------------------- nuanceur encré
// variante: 'corps' (peau du squelette, relief), 'tete' (plus les traits du visage), 'decor' (instancié, normale
// de coque à part), 'sol' (sans coque). Un programme par variante.
const ENCRE_GLSL = /* glsl */`
  uniform vec3 uInk, uLit, uShadeMul, uShadeAdd, uRim, uLampPos, uLampCol;
  uniform float uVig, uDetail, uHatchPx, uLampR, uLampOn, uHatch;
  uniform vec4 uView;
  vec3 encre(vec3 albedo, vec3 N, vec3 V, vec3 L, float sh, vec3 vpos, vec2 anchor, float ground) {
    float ndl = dot(N, L);
    float lit = smoothstep(0.10, 0.13, ndl) * sh;
    vec3 cl = albedo * uLit;
    // Ombre teintée: la teinte glisse vers la couleur d'ombre du lieu, la matière garde sa saturation.
    vec3 cs = albedo * uShadeMul + uShadeAdd * (0.4 + albedo * 2.0);
    vec3 c = mix(cs, cl, lit);
    vec2 q = gl_FragCoord.xy - anchor;
    if (ground < 0.5) {
      // Troisième ton: le creux de l'ombre, plus dense.
      float deep = smoothstep(-0.50, -0.54, ndl);
      c = mix(c, cs * 0.66, deep * (1.0 - lit));
      // Hachures: ancrées à l'objet (elles le suivent sans glisser), pas constant à l'écran.
      float h1 = fract((q.x + q.y * 0.85) / uHatchPx);
      float pen = 1.0 - smoothstep(0.13, 0.27, ndl);
      c = mix(c, cs, step(h1, 0.5 * pen) * lit * uDetail * uHatch);
      float h2 = fract((q.x - q.y * 0.85) / uHatchPx);
      float dp = smoothstep(-0.45, -0.9, ndl);
      c = mix(c, uInk, step(h2, 0.30 * dp) * (1.0 - lit) * uDetail * uHatch * 0.85);
      // Liseré clair: seulement du côté du soleil, sinon halo autour des mains.
      float fres = 1.0 - max(dot(N, V), 0.0);
      c += uRim * step(0.70, fres) * step(0.32, ndl) * sh;
    }
    // Lanterne: flaque à deux anneaux nets, qui éclaire aussi les volumes tournés vers elle.
    vec3 dl = uLampPos - vpos;
    float dist = length(dl);
    float nl2 = ground > 0.5 ? 1.0 : step(0.05, dot(N, dl / dist));
    float wob = sin(atan(dl.z, dl.x) * 7.0) * 0.05 + sin(atan(dl.z, dl.x) * 3.0 + 1.0) * 0.06;
    float k1 = step(dist, uLampR * (1.0 + wob)) * nl2 * uLampOn;
    float k2 = step(dist, uLampR * (0.56 + wob * 0.6)) * nl2 * uLampOn;
    c = mix(c, max(c, albedo * uLampCol * 0.45), k1);
    c = mix(c, max(c, albedo * uLampCol), k2);
    vec2 p = (gl_FragCoord.xy - uView.xy) / uView.zw - 0.5;
    float v = smoothstep(0.18, 0.66, length(p * vec2(0.92, 1.0)));
    return c * (1.0 - uVig * v);
  }`;
function inkMaterial({ map = null, variante = 'corps', traits = null, push = 0, color = 0xffffff }) {
  const m = new THREE.MeshToonMaterial({ map, color });
  const perso = variante === 'corps' || variante === 'tete';
  const hull = variante !== 'sol';
  const relief = perso && map;
  m.userData.push = { value: push };
  m.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, U);
    sh.uniforms.traitsMap = { value: traits?.map ?? null };
    sh.uniforms.uCell = traits?.cell ?? { value: 0 };
    sh.uniforms.uPush = m.userData.push;
    sh.uniforms.uHatch = { value: variante === 'tete' ? 0 : 1 };   // pas de hachures sur les visages: ils restent nets
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', `#include <common>
        attribute float aOutline; attribute vec2 traitsUv; attribute vec3 aHullN;
        varying float vOutline; varying vec2 vTraits; flat varying vec2 vAnchor;
        uniform vec2 uRes; uniform float uPx; uniform float uPush; uniform vec4 uView;
        ${relief ? 'uniform sampler2D map;' : ''}`)
      .replace('#include <uv_vertex>', `#include <uv_vertex>
        vOutline = aOutline; vTraits = traitsUv;`)
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        ${relief ? 'transformed += normalize(objectNormal) * (textureLod(map, uv, 0.0).a - 0.44) * uPush;' : ''}`)
      .replace('#include <project_vertex>', `#include <project_vertex>
        vec4 org = vec4(0.0, 0.0, 0.0, 1.0);
        #ifdef USE_INSTANCING
          org = instanceMatrix * org;
        #endif
        org = projectionMatrix * modelViewMatrix * org;
        vAnchor = uView.xy + (org.xy / org.w * 0.5 + 0.5) * uView.zw;
        ${hull ? `if (aOutline > 0.5) {
          ${variante === 'decor' ? `vec3 hn = aHullN;
          #ifdef USE_INSTANCING
            hn = mat3(instanceMatrix) * hn;
          #endif
          hn = normalMatrix * hn;` : 'vec3 hn = transformedNormal;'}
          vec2 n2 = normalize((projectionMatrix * vec4(hn, 0.0)).xy + 1e-5);
          // Trait un peu irrégulier (80 à 120 %), lié au corps: il ne grouille pas.
          float k = 0.8 + 0.4 * (0.5 + 0.5 * sin(position.x * 0.31 + position.y * 0.17) * sin(position.z * 0.23 - position.y * 0.11 + 1.7));
          gl_Position.xy += n2 * uPx * k * 2.0 / uRes * gl_Position.w;
        }` : ''}`);
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', `#include <common>
        varying float vOutline; varying vec2 vTraits; flat varying vec2 vAnchor;
        uniform sampler2D traitsMap; uniform float uCell; uniform float uBias;
        ${ENCRE_GLSL}`)
      .replace('#include <shadowmap_pars_fragment>', '#include <shadowmap_pars_fragment>\n#include <shadowmask_pars_fragment>')
      .replace('#include <map_fragment>', `
        float hRelief = 0.5;
        #ifdef USE_MAP
          vec4 sampledDiffuseColor = texture2D(map, vMapUv, ${perso ? 'uBias' : '0.0'});
          diffuseColor.rgb *= sampledDiffuseColor.rgb;
          hRelief = sampledDiffuseColor.a;
        #endif
        ${traits ? `if (vTraits.x > 0.0 && vTraits.x < 1.0 && vTraits.y > 0.0 && vTraits.y < 1.0) {
          // Atlas des traits en grille (traits.json): colonne et rangée de l'expression.
          vec4 t = texture2D(traitsMap, vec2((vTraits.x + mod(uCell, ${TJ.colonnes.toFixed(1)})) / ${TJ.colonnes.toFixed(1)}, (vTraits.y + floor(uCell / ${TJ.colonnes.toFixed(1)})) / ${TJ.rangees.toFixed(1)}));
          diffuseColor.rgb = mix(diffuseColor.rgb, t.rgb, t.a * uDetail);
        }` : ''}`)
      .replace('#include <normal_fragment_maps>', `#include <normal_fragment_maps>
        ${relief ? `{
          // Relief: la carte de hauteur de l'atlas (1 = 2 cm) incline la normale, donc la rampe à tons francs.
          vec3 sx = dFdx(-vViewPosition), sy = dFdy(-vViewPosition);
          vec3 r1 = cross(sy, normal), r2 = cross(normal, sx);
          float det = dot(sx, r1);
          vec3 grad = sign(det) * (dFdx(hRelief) * r1 + dFdy(hRelief) * r2);
          normal = normalize(abs(det) * normal - 0.036 * grad);
        }` : ''}`)
      .replace('#include <opaque_fragment>', `
        #if NUM_DIR_LIGHTS > 0
          vec3 sunDir = directionalLights[0].direction;
        #else
          vec3 sunDir = vec3(0.0, 1.0, 0.0);
        #endif
        outgoingLight = encre(diffuseColor.rgb, normal, normalize(vViewPosition), sunDir, smoothstep(0.40, 0.60, getShadowMask()), -vViewPosition, vAnchor, ${variante === 'sol' ? '1.0' : '0.0'});
        if (vOutline > 0.5) outgoingLight = uInk;
        #include <opaque_fragment>`);
  };
  m.customProgramCacheKey = () => `encre-${variante}-${relief ? 'r' : ''}${traits ? 't' : ''}`;
  return m;
}

// Coque cuite: sommets doublés (aOutline = 1), triangles retournés; aucun appel de dessin en plus.
function bakeOutline(geo, hullNormals = null) {
  const n = geo.attributes.position.count;
  const out = new THREE.BufferGeometry();
  for (const [name, attr] of Object.entries(geo.attributes)) {
    const a = new attr.array.constructor(attr.array.length * 2);
    a.set(attr.array); a.set(attr.array, attr.array.length);
    out.setAttribute(name, new THREE.BufferAttribute(a, attr.itemSize, attr.normalized));
  }
  const flag = new Float32Array(n * 2); flag.fill(1, n);
  out.setAttribute('aOutline', new THREE.BufferAttribute(flag, 1));
  const t = geo.attributes.uv1 ? geo.attributes.uv1.array : new Float32Array(n * 2).fill(-4);
  const tu = new Float32Array(n * 4); tu.set(t); tu.fill(-4, n * 2);
  out.setAttribute('traitsUv', new THREE.BufferAttribute(tu, 2));
  const hn = new Float32Array(n * 6);
  const src = hullNormals ?? geo.attributes.normal.array;
  hn.set(src); hn.set(src, n * 3);
  out.setAttribute('aHullN', new THREE.BufferAttribute(hn, 3));
  const idx = geo.index ? geo.index.array : [...Array(n).keys()];
  const res = [];
  for (let i = 0; i < idx.length; i += 1) res.push(idx[i]);
  for (let i = 0; i < idx.length; i += 3) res.push(idx[i] + n, idx[i + 2] + n, idx[i + 1] + n);
  out.setIndex(res);
  out.boundingSphere = geo.boundingSphere?.clone() ?? null;
  out.boundingBox = geo.boundingBox?.clone() ?? null;
  return out;
}

// ---------------------------------------------------------------- textures
const loader = new GLTFLoader();
const BMP = { premultiplyAlpha: 'none', colorSpaceConversion: 'none' };
// Atlas d'un personnage. Avec `efface`, les niveaux de mip viennent du fichier `.loin.png`: niveau 1 à mi-détail,
// niveaux 2 et suivants en aplats sans trait. Sans, mipmaps ordinaires (pour comparer).
async function loadAtlas(url, efface) {
  const l0 = await createImageBitmap(await (await fetch(url)).blob(), BMP);
  const tex = new THREE.Texture(l0);
  tex.flipY = false; tex.colorSpace = THREE.SRGBColorSpace;
  tex.minFilter = THREE.LinearMipmapLinearFilter; tex.magFilter = THREE.LinearFilter;
  if (efface) {
    const far = await (await fetch(url.replace('.png', '.loin.png'))).blob();
    const levels = [l0, await createImageBitmap(far, 0, 0, 256, 256, BMP), await createImageBitmap(far, 256, 0, 128, 128, BMP)];
    for (let s = 64; s >= 1; s /= 2) levels.push(await createImageBitmap(far, 256, 0, 128, 128, { ...BMP, resizeWidth: s, resizeHeight: s, resizeQuality: 'high' }));
    tex.mipmaps = levels; tex.generateMipmaps = false;
  }
  tex.needsUpdate = true;
  return tex;
}
const cache = {};
async function glb(url) { cache[url] ??= loader.loadAsync(url); return cache[url]; }
// Atlas des traits dessinés à la plume: un par personnage (traits.py), `traits.png` pour un visage sans fiche.
const TJ = await (await fetch(ESSAI + 'atlas/traits.json')).json();
const EXPRESSION = Object.fromEntries(TJ.expressions.map((n, i) => [n, i]));
const traitsCache = {};
const traitsTexture = (url) => (traitsCache[url] ??= new Promise((ok) => new THREE.TextureLoader().load(ESSAI + url, (t) => { t.flipY = false; t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; ok(t); })));

// ---------------------------------------------------------------- personnages
const contactGeo = (() => {
  // Ombre de contact: un aplat d'encre à bord net, un peu irrégulier (polygone à 11 côtés).
  const s = new THREE.Shape();
  for (let k = 0; k < 11; k += 1) { const a = (k / 11) * Math.PI * 2; const r = 1 + 0.12 * Math.sin(k * 2.3); s[k ? 'lineTo' : 'moveTo'](Math.cos(a) * r, Math.sin(a) * r * 0.72); }
  return new THREE.ShapeGeometry(s);
})();
const contactMat = new THREE.MeshBasicMaterial({ color: 0x0d0a0c, transparent: true, opacity: 0.62, depthWrite: false });
async function personnage({ corps, atlas, coiffure, col = false, expression = 0, efface = true, traits = 'atlas/traits.png' }) {
  const g = await glb(ESSAI + `modeles/${corps}.glb`);
  const root = SkeletonUtils.clone(g.scene);
  const map = await loadAtlas(ESSAI + atlas, efface);
  const traitsTex = await traitsTexture(traits);
  const cell = { value: expression };
  let tris = 0, headBone = null, chestBone = null, height = 0, scaleW = 1;
  root.updateMatrixWorld(true);
  root.traverse((o) => {
    if (!o.isSkinnedMesh) return;
    o.geometry.computeBoundingBox();
    height = Math.max(height, o.geometry.boundingBox.max.y, o.geometry.boundingBox.max.z);
    scaleW = 1;
  });
  // Poussée des sommets par le relief: 2,6 cm pour la hauteur pleine (le maillage exporté est en mètres).
  const push = 0.026 / scaleW;
  const matCorps = inkMaterial({ map, variante: 'corps', push });
  const matTete = inkMaterial({ map, variante: 'tete', traits: { map: traitsTex, cell }, push: push * 0.4 });
  const matCheveux = inkMaterial({ map, variante: 'corps', push: 0 });
  root.traverse((o) => {
    if (o.isBone && o.name === 'Head') headBone = o;
    if (o.isBone && o.name === 'Spine') chestBone = o;
    if (o.isSkinnedMesh) {
      o.geometry = bakeOutline(o.geometry);
      o.material = o.material.name === 'tete' ? matTete : matCorps;
      o.frustumCulled = false; o.castShadow = true; o.receiveShadow = true;
      tris += o.geometry.index.count / 3;
    }
  });
  const holder = new THREE.Group();
  holder.add(root);
  if (coiffure) {
    const h = await glb(ESSAI + `modeles/${corps}-${coiffure}.glb`);
    const hair = h.scene.clone(true);
    hair.traverse((o) => { if (o.isMesh) { o.geometry = bakeOutline(o.geometry); o.material = matCheveux; o.castShadow = true; o.receiveShadow = true; tris += o.geometry.index.count / 3; } });
    headBone.attach(hair);
  }
  if (col) {
    // Col en volume: une pièce commune, posée sur chaque corps, qui suit la poitrine.
    const h = await glb(ESSAI + `modeles/${corps}-col.glb`);
    const piece = h.scene.clone(true);
    piece.traverse((o) => { if (o.isMesh) { o.geometry = bakeOutline(o.geometry); o.material = matCheveux; o.castShadow = true; tris += o.geometry.index.count / 3; } });
    chestBone.attach(piece);
  }
  const blob = new THREE.Mesh(contactGeo, contactMat);
  blob.rotation.x = -Math.PI / 2; blob.position.y = 0.012; blob.scale.setScalar(corps === 'costaud' ? 0.36 : corps === 'enfant' ? 0.22 : 0.27);
  blob.renderOrder = 2;
  holder.add(blob);
  scene.add(holder);
  const mixer = new THREE.AnimationMixer(root);
  const clips = Object.fromEntries(g.animations.map((a) => [a.name, a]));
  const api = {
    holder, tris, cell, height, corps,
    pose(name, t = 0) {
      mixer.stopAllAction(); const c = clips[name]; if (c) { mixer.clipAction(c).play(); mixer.setTime(t); } holder.updateMatrixWorld(true);
    },
    head() { holder.updateMatrixWorld(true); return headBone.getWorldPosition(new THREE.Vector3()); },
    at(x, z, ry, clip = 'repos', t = 0) { holder.position.set(x, 0, z); holder.rotation.y = ry; api.pose(clip, t); },
  };
  return api;
}

// ---------------------------------------------------------------- sol et décor en volume
// Le chemin serpente: sa ligne médiane en mètres (la texture du sol et les pierres posées en volume la suivent).
const TUILE = 8;
const pathZ = (x) => { const u = ((((x + 12) / TUILE) % 1) + 1) % 1; return 1.55 + (45 * Math.sin(2 * Math.PI * u) + 18 * Math.sin(4 * Math.PI * u + 1)) * (TUILE / 1024); };
function paintGround() {
  // Dessin à plat seulement (aplats, touffes en V, ornières): tout ce qui a un volume est posé en 3D.
  const c = document.createElement('canvas');
  c.width = c.height = 1024;
  const g = c.getContext('2d');
  let seed = 23;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const pal = { herbe: ['#74853F', '#566A33', '#3B4B27', '#27341F'], terre: ['#A88F5E', '#8A7048', '#5F4A33'], encre: '#1F1814' };
  const py = (x) => { const z = pathZ(-12 + (x / 1024) * TUILE); return ((z + 12) % TUILE) / TUILE * 1024; };
  const poly = (x, y, r, n, sq, col) => {
    // Chaque plaque est redessinée sur les tuiles voisines: le motif boucle sans coupure.
    const rs = []; for (let a = 0; a < n; a += 1) rs.push(r * (0.62 + rnd() * 0.5));
    g.fillStyle = col;
    for (const ox of [-1024, 0, 1024]) for (const oy of [-1024, 0, 1024]) { g.beginPath(); rs.forEach((rr, a) => g.lineTo(x + ox + Math.cos((a / n) * 6.283) * rr, y + oy + Math.sin((a / n) * 6.283) * rr * sq)); g.fill(); }
  };
  g.fillStyle = pal.herbe[1]; g.fillRect(0, 0, 1024, 1024);
  for (let k = 0; k < 9; k += 1) poly(rnd() * 1024, rnd() * 1024, 110 + rnd() * 120, 9, 0.7, pal.herbe[2]);
  for (let k = 0; k < 9; k += 1) poly(rnd() * 1024, rnd() * 1024, 30 + rnd() * 60, 7, 0.65, pal.herbe[0]);
  for (let k = 0; k < 6; k += 1) poly(rnd() * 1024, rnd() * 1024, 40 + rnd() * 50, 7, 0.6, pal.herbe[3]);
  g.save(); g.lineCap = 'round'; g.lineJoin = 'round';

    gameShot({ x: w3, y, w: w3, h: r6 }, tgt, 50, 120);
    labels.push(['sans effacement (mipmaps ordinaires, hachures gardées), 120 px', 5, y + 4, 12], ['avec effacement (aplats de loin, détail fondu), 120 px', w3 + 5, y + 4, 12]);
    mesures.textures = renderer.info.memory.textures;
    mesures.geometries = renderer.info.memory.geometries;
    mesures.programmes = renderer.info.programs?.map((p) => p.cacheKey.slice(0, 40));
    mesures.essai3 = { x: 2 * w3, y, w: w3, h: r6 };
  } else {
    const amb = params.get('amb') ?? 'jour'; ambiance(amb);
    if (vue === 'jeu') { only(...Object.values(P)); place(P); gameShot(full, tgt, 50, Number(params.get('px') ?? 60)); }
    if (vue === 'jeu-sans') { only(...Object.values(NF)); place(NF); noFade = true; gameShot(full, tgt, 50, Number(params.get('px') ?? 60)); }
    if (vue === 'proche') proche(full);
    const cel = params.get('cellule') ?? '0';
    if (vue === 'visage') visage(full, params.get('qui') ?? 'maelle', EXPRESSION[cel] ?? Number(cel), Number(params.get('zoom') ?? 8.2));
    if (vue === 'expressions') {
      // Les expressions d'un personnage en gros plan, sur une rangée: `liste=neutre,joie,...`.
      const liste = (params.get('liste') ?? TJ.expressions.join(',')).split(',');
      liste.forEach((n, k) => { visage({ x: k * W / liste.length, y: 0, w: W / liste.length, h: H }, params.get('qui') ?? 'maelle', EXPRESSION[n], Number(params.get('zoom') ?? 4.6)); labels.push([n, k * W / liste.length + 5, 4, 12]); });
    }
    if (vue === 'portraits') {
      const key = params.get('qui') ?? 'maelle';
      ['face', 'dos', 'marche', 'repos'].forEach((kind, k) => portrait(P[key], { x: k * W / 4, y: 0, w: W / 4, h: H }, kind));
    }
    if (vue === 'croix') X.forEach((x, k) => { only(x.p); x.p.at(STUDIO.x, STUDIO.z, 0.45, 'repos'); shot({ x: (k % 5) * W / 5, y: Math.floor(k / 5) * H / 2, w: W / 5, h: H / 2 }, new THREE.Vector3(STUDIO.x + 1.4, 3.4, STUDIO.z + 8.6), new THREE.Vector3(STUDIO.x, 0.9, STUDIO.z), 13.5); });
    if (vue === 'visages') EXPR.forEach(([key, cellule], k) => visage({ x: k * W / 4, y: 0, w: W / 4, h: H }, key, cellule));
  }
  const sheet = document.createElement('canvas');
  sheet.width = W; sheet.height = H;
  const ctx = sheet.getContext('2d');
  ctx.fillStyle = '#14110f'; ctx.fillRect(0, 0, W, H);
  ctx.drawImage(renderer.domElement, 0, 0);
  if (mesures.essai3) {
    // L'essai 3 à côté: sa vue du jeu de jour, reprise telle quelle de sa planche.
    const img = new Image(); img.src = ESSAI3 + 'comparaison.png'; await img.decode();
    const r = mesures.essai3; const sw = 600, sh = Math.min(360, 600 * r.h / r.w);
    ctx.drawImage(img, 600, 738, sw, sh, r.x, r.y, r.w, r.h);
    labels.push(['essai 3, pour mesurer le progrès (sa vue du jeu de jour, 60 px, 55 degrés)', r.x + 5, r.y + 4, 12]);
    delete mesures.essai3;
  }
  for (const [text, x, yy, size] of labels) { ctx.font = `bold ${size}px sans-serif`; ctx.fillStyle = 'rgba(20,17,15,0.82)'; const w = ctx.measureText(text).width; ctx.fillRect(x - 4, yy - 2, w + 8, size + 6); ctx.fillStyle = '#efe6d2'; ctx.textBaseline = 'top'; ctx.fillText(text, x, yy); }
  window.banc = { pret: true, mesures, image: sheet.toDataURL('image/png') };
} catch (e) {
  window.banc = { erreur: String(e.stack ?? e), mesures, image: renderer.domElement.toDataURL('image/png') };
}
</script>
