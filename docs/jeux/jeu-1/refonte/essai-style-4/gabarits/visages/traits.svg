<!--
  Atlas des traits du visage, dessiné à la plume: bibliothèque de pièces (bible 0.2, 2.4 et 2.5).
  Chaque <symbol> est une pièce; `data-cadre` dit sur quel repère elle se pose:
  - oeil: origine au centre de l'oeil GAUCHE de l'image (coin extérieur vers -x); l'oeil droit est la
    même pièce en miroir, encrée à part (le tremblé diffère d'un côté à l'autre);
  - bouche: origine au milieu du trait de la bouche;
  - nez: origine sous le bout du nez (base), placée à la hauteur du nez du corps;
  - cellule: repère de la cellule entière (256 x 256, yeux à y 51, bouche à y 205);
  - etendu: même repère que la cellule, mais peint dans l'atlas du corps (front, menton, mâchoire),
    hors de la cellule des traits.
  Unités: 256 = une cellule (128 px dans l'atlas). Trait de plume de 5 unités (2 à 3 px), lumière en
  haut à gauche: le moteur épaissit le côté de l'ombre (bas droite).
  Couleurs de remplacement (fixées par personnage dans `traits.py`):
    #FF00A1 iris, #FF00A2 sourcils et poils, #FF00A3 ombre de la peau, #FF00A4 rougeur des joues,
    #FF00A5 intérieur de la bouche, #FF00A6 lèvre, #FF00A7 tache de rousseur, #FF00A8 reflet de verre.
  Toute forme sans `data-w` reçoit un contour d'encre; `data-w="0"` la laisse en aplat; un trait
  `fill="none"` devient un trait effilé. `data-clip` découpe une forme par une autre (iris dans le blanc).
-->
<svg xmlns="http://www.w3.org/2000/svg">

  <!-- ===================================================================== YEUX (oeil gauche) -->

