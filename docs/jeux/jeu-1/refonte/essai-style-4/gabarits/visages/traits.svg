      <circle cx="3" cy="0" r="11.5" fill="#FF00A1"/>
      <path d="M-9 -4 Q3 -12 15 -4 L15 -12 L-9 -12 Z" fill="#231A17" fill-opacity="0.35"/>
      <circle cx="3" cy="0.5" r="5.6" fill="#231A17"/>
