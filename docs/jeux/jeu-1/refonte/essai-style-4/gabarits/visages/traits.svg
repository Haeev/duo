    <path d="M-33 5 Q-25 -10 -4 -14.5 Q18 -16 31 -3 L32 1 Q19 -10 -2 -10 Q-20 -8 -29 4 Z" fill="#231A17" data-w="0.35"/>
    <path fill="none" d="M-29 3 Q-33 3 -36 1" data-w="0.8"/>
    <path fill="none" d="M-21 -19 Q-4 -26 17 -19" data-w="0.45"/>
    <path fill="none" d="M-23 7 Q-12 13 5 12" data-w="0.5"/>
