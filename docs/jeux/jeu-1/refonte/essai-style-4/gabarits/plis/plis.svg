<!--
  Gabarits de plis et d'encre des vêtements, dessinés à la plume (bible 0.2, 2.8).
  Chaque <symbol> est un tampon, dessiné à plat dans un repère « déroulé » du corps (voir plis.toml):
  - bras, jambe: x fait le tour du membre (400 = le tour entier, 200 = le côté `angle` de la fiche,
    0 et 400 = le côté opposé, raccordés), y descend le long du membre (100 = l'articulation);
  - torse: x va du milieu devant (0) au milieu du dos (400), le côté à 200; le même dessin sert aux deux
    côtés (miroir); y descend (100 = le repère: taille, aisselle);
  - bord: bande d'ourlet, x le long du bord (tuile qui se répète), y du bord (0) vers l'intérieur (3 cm);
  - couture: bande de 3 cm centrée sur la couture (x 30), y le long (tuile);
  - plan: pièce posée de face (poche, bouton), au repère et à la taille de la fiche;
  - tuile: motif qui se répète (x et y), en coordonnées du tissu qui suivent le volume.
  Calques (`data-expr`): `encre` (traits effilés, noirs pleins, hachures), `ombre` (ombre peinte),
  `clair` (clair des bosses), `z1`, `z2`, `filet` (zones de couleur d'un motif: masques).
  La hauteur (canal alpha de l'atlas, relief du nuanceur) en est tirée: l'encre creuse, l'ombre creuse un
  peu, le clair bombe. Dessin en noir: seule la couverture compte, la couleur vient de la tenue.
  Lumière en haut à gauche; un pli = 2 à 4 traits effilés, un aplat d'ombre dessous, un noir au creux.
-->
