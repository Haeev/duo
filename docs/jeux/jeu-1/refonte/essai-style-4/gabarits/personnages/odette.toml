# Personnage d'essai: un corps commun, une tenue, une coiffure, des couleurs. Rien d'autre.
# Facultatif: `rides = true`, `racine = 0.2` (hauteur de la racine des cheveux), et un bloc [coloris]
# (`haut = ["!canard", "bouteille", "craie"]`) qui change les couleurs de la tenue sans nouvelle fiche.
id = "odette"
tenue = "blouse-gilet"
coiffure = "chignon"
peau = "peaux.porcelaine"
cheveux = "cheveux.blanc"
rides = true

[corps]
gabarit = "agee"
donnees = "modeles/agee.npz"
