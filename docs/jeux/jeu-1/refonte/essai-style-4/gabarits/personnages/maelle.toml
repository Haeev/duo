# Personnage d'essai: un corps commun, une tenue, une coiffure, des couleurs. Rien d'autre.
# Facultatif: `rides = true`, `racine = 0.2` (hauteur de la racine des cheveux), et un bloc [coloris]
# (`haut = ["!canard", "bouteille", "craie"]`) qui change les couleurs de la tenue sans nouvelle fiche.
id = "maelle"
tenue = "carreaux-jean"
coiffure = "carre"
peau = "peaux.peche"
cheveux = "cheveux.auburn"

[visage]              # traits dessinés (gabarits/visages): age (jeune, adulte, age), nez (droit, rond, busque),
age = "adulte"        # iris, marques en plus (taches, moustache, barbe, barbe-machoire, lunettes, sillons...),
nez = "droit"         # sourcils (couleur, par défaut celle des cheveux)
iris = "iris.noisette"
marques = ["taches"]

[corps]
gabarit = "femme"
donnees = "modeles/femme.npz"
