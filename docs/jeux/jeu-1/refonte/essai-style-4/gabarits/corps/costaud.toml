# Corps commun « costaud ». Costaud: épaules larges, ventre en tonneau, jambes courtes.
# Gabarit: copier ce fichier pour un nouveau corps (rig Meshy dans <dossier>/costaud/marche.glb), lancer
# `python3 scripts/construire.py --corps <dossier>` et régler les valeurs sur la planche `.travail/reperes-costaud.png`.
id = "costaud"
triangles = 2300      # triangles visibles (la coque d'encre double le compte)
pieds = 1.0           # échelle des pieds autour de la cheville
triangles_tete = 560   # dont la tête (bible 2.2: 400 à 600)
tete = 1.06           # échelle de la tête autour de la base du crâne (viser 7 têtes; enfant 5,5)

[mains]               # moufle refaite (tete_mains.mitaines): main large et épaisse, de travailleur
longueur = 0.186      # du poignet au bout des doigts, en mètres (environ 0,105 x taille)
largeur = 0.53        # largeur de la paume, fraction de la longueur
epaisseur = 0.27      # épaisseur de la paume, fraction de la longueur
jointures = [16, 22]  # pli des doigts aux jointures puis au milieu, en degrés (repos détendu)

[visage]              # MESURÉ par conformer_corps.py (tete_mains.mesurer): ne pas régler à la main
menton = 0.306        # du sommet du crâne au menton, en mètres, tête à l'échelle 1
yeux = 0.262          # centre des yeux, fraction de la hauteur de tête depuis le sommet
bouche = 0.705        # trait de la bouche, même unité
ecart = 0.130         # demi-distance entre les yeux, fraction de la hauteur de tête
nez = 0.672           # base du nez, fraction du chemin des yeux à la bouche (traits.py)
saillie_nez = 0.0146  # saillie du nez simple au-dessus du visage lissé, en mètres
