# Corps commun « agee ». Femme âgée: petite, dos rond, tête en avant.
# Gabarit: copier ce fichier pour un nouveau corps (rig Meshy dans <dossier>/agee/marche.glb), lancer
# `python3 scripts/construire.py --corps <dossier>` et régler les valeurs sur la planche `.travail/reperes-agee.png`.
id = "agee"
triangles = 2300      # triangles visibles (la coque d'encre double le compte)
pieds = 1.0           # échelle des pieds autour de la cheville
triangles_tete = 560   # dont la tête (bible 2.2: 400 à 600)
tete = 0.9           # échelle de la tête autour de la base du crâne (viser 7 têtes; enfant 5,5)

[mains]               # moufle refaite (tete_mains.mitaines): petite main, un peu repliée
longueur = 0.152      # du poignet au bout des doigts, en mètres (environ 0,105 x taille)
largeur = 0.46        # largeur de la paume, fraction de la longueur
epaisseur = 0.23      # épaisseur de la paume, fraction de la longueur
jointures = [22, 28]  # pli des doigts aux jointures puis au milieu, en degrés (repos détendu)

[visage]              # MESURÉ par conformer_corps.py (tete_mains.mesurer): ne pas régler à la main
menton = 0.300        # du sommet du crâne au menton, en mètres, tête à l'échelle 1
yeux = 0.365          # centre des yeux, fraction de la hauteur de tête depuis le sommet
bouche = 0.785        # trait de la bouche, même unité
ecart = 0.130         # demi-distance entre les yeux, fraction de la hauteur de tête
nez = 0.748           # base du nez, fraction du chemin des yeux à la bouche (traits.py)
saillie_nez = 0.0122  # saillie du nez simple au-dessus du visage lissé, en mètres
