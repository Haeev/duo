# Coiffure « chignon »: cheveux tirés, chignon haut à facettes, deux mèches échappées aux tempes.
id = "chignon"
graine = 2

[calotte]
volume = 0.06
front_deg = 40
cotes_deg = 84
nuque_deg = 104
