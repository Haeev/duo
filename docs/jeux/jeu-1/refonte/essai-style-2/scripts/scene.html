<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Essai de style 2: comparaison des voies A et B</title>
<style>body { margin: 0; background: #1d1c1a; } canvas { display: block; }</style>
<script type="importmap">
{ "imports": { "three": "/three/build/three.module.js", "three/addons/": "/three/examples/jsm/" } }
</script>
</head>
<body>
<script type="module">
// Planche de comparaison: pour chaque voie, deux personnages de face, de dos et en marche, puis la vue du jeu
// (caméra haute) et une vue proche derrière le personnage, sur un petit décor texturé (pavés, crépi, banc), de jour.
// Adresse: ?a1=<glb>&a2=<glb>&b1=<glb>&b2=<glb> (B: sorties brutes de Meshy servies hors du dépôt).
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const params = new URLSearchParams(location.search);
const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.info.autoReset = false;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbcd3e3);
scene.add(new THREE.HemisphereLight(0xdfeaf5, 0x8a7a62, 1.1));
const sun = new THREE.DirectionalLight(0xfff1dc, 2.6);
sun.position.set(4, 7, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 0.5, far: 25 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.02;
scene.add(sun, sun.target);

// Textures du décor peintes au canevas (256 px), répétées.
function canvasTexture(draw, repeat) {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  draw(c.getContext('2d'));
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeat[0], repeat[1]);
  t.anisotropy = 4;
  return t;
}
let seed = 7;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const paving = canvasTexture((g) => {
  g.fillStyle = '#6f6a62'; g.fillRect(0, 0, 256, 256);
  for (let y = 0; y < 4; y += 1) for (let x = 0; x < 4; x += 1) {
    const off = (y % 2) * 32;
    const v = 135 + Math.floor(rnd() * 40);
    g.fillStyle = `rgb(${v},${v - 6},${v - 14})`;
    g.fillRect(x * 64 + off + 3, y * 64 + 3, 58, 58);
    if (x === 0 && off) { g.fillRect(off - 64 + 3, y * 64 + 3, 58, 58); }
    for (let k = 0; k < 120; k += 1) { g.fillStyle = `rgba(40,35,30,${rnd() * 0.12})`; g.fillRect(x * 64 + off + rnd() * 60, y * 64 + rnd() * 60, 2, 2); }
  }
}, [6, 6]);
const plaster = canvasTexture((g) => {
  g.fillStyle = '#d9c7a4'; g.fillRect(0, 0, 256, 256);
  for (let k = 0; k < 5000; k += 1) { const v = rnd(); g.fillStyle = v > 0.5 ? 'rgba(255,250,235,0.18)' : 'rgba(120,95,60,0.14)'; g.fillRect(rnd() * 256, rnd() * 256, 2 + rnd() * 3, 2 + rnd() * 3); }
  g.fillStyle = 'rgba(110,90,60,0.35)'; g.fillRect(0, 226, 256, 30);
}, [4, 1]);
const wood = canvasTexture((g) => {
  g.fillStyle = '#8a5b34'; g.fillRect(0, 0, 256, 256);
  for (let y = 0; y < 256; y += 3) { g.fillStyle = `rgba(${rnd() > 0.5 ? '60,35,20' : '170,120,70'},${0.15 + rnd() * 0.2})`; g.fillRect(0, y, 256, 1 + rnd() * 2); }
  for (let k = 0; k < 4; k += 1) { g.fillStyle = 'rgba(40,25,15,0.6)'; g.fillRect(0, k * 64, 256, 3); }
}, [1, 1]);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(24, 24), new THREE.MeshStandardMaterial({ map: paving, roughness: 0.9 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
const wall = new THREE.Mesh(new THREE.BoxGeometry(12, 2.6, 0.3), new THREE.MeshStandardMaterial({ map: plaster, roughness: 0.95 }));
wall.position.set(0, 1.3, -2.2);
wall.castShadow = wall.receiveShadow = true;
scene.add(wall);
// Banc: trois lattes d'assise et un dossier sur deux pieds, contre le mur (on s'y assoit face à la place).
const woodMat = new THREE.MeshStandardMaterial({ map: wood, roughness: 0.8 });
const bench = new THREE.Group();
for (let i = 0; i < 3; i += 1) { const s = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.04, 0.12), woodMat); s.position.set(0, 0.45, -0.14 + i * 0.14); bench.add(s); }
for (const x of [-0.7, 0.7]) { const l = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.45, 0.4), woodMat); l.position.set(x, 0.225, 0); bench.add(l); }
const back = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.3, 0.04), woodMat); back.position.set(0, 0.72, -0.24); back.rotation.x = -0.12; bench.add(back);
bench.traverse((o) => { if (o.isMesh) o.castShadow = o.receiveShadow = true; });
bench.position.set(0, 0, -1.7);
scene.add(bench);

const loader = new GLTFLoader();
async function character(url, height) {
  const g = await loader.loadAsync(url);
  const root = g.scene;
  root.traverse((o) => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; o.frustumCulled = false; if (o.material.map) o.material.map.anisotropy = 4; } });
  const box = new THREE.Box3().setFromObject(root);
  if (height) root.scale.multiplyScalar(height / (box.max.y - box.min.y));
  const holder = new THREE.Group();
  holder.add(root);
  scene.add(holder);
  const mixer = new THREE.AnimationMixer(root);
  const clip = g.animations.find((a) => /walk/i.test(a.name)) ?? g.animations[0];
  let tris = 0;
  root.traverse((o) => { if (o.isMesh) tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; });
  return {
    holder, root, tris,
    pose(walk, t) { mixer.stopAllAction(); if (walk && clip) { mixer.clipAction(clip).play(); mixer.setTime(t); } },
    textures: (() => { const s = new Set(); root.traverse((o) => { if (o.isMesh && o.material.map) s.add(o.material.map.image); }); return [...s].map((i) => `${i.width}x${i.height}`); })(),
  };
}
const cam = new THREE.PerspectiveCamera(28, 1, 0.05, 80);
function shot(rect, from, to, fov = 28) {
  cam.fov = fov; cam.aspect = rect.w / rect.h; cam.position.copy(from); cam.lookAt(to); cam.updateProjectionMatrix();
  renderer.setViewport(rect.x, H - rect.y - rect.h, rect.w, rect.h);
  renderer.setScissor(rect.x, H - rect.y - rect.h, rect.w, rect.h);
  renderer.setScissorTest(true);
  renderer.render(scene, cam);
}
const labels = [];
const voies = [['A', 'Voie A: notre chaîne par gabarits, corps à 7 têtes, vêtements et visage peints dans un atlas de 512 px', params.get('a1'), params.get('a2'), null],
  ['B', 'Voie B: personnage entier généré et texturé par Meshy (référence, non modulaire)', params.get('b1'), params.get('b2'), 1.7]];
const blockH = H / 2;
const mesures = {};
for (const [k, [id, title, u1, u2, height]] of voies.entries()) {
  const y0 = k * blockH;
  labels.push([title, 10, y0 + 6, 20]);
  if (!u1) continue;
  const chars = [await character(u1, height), await character(u2, height === null ? null : 1.74)];
  mesures[id] = chars.map((c) => ({ triangles: c.tris, textures: c.textures }));
  const all = [];
  scene.traverse((o) => all.push(o));
  // Portraits: chaque personnage seul au milieu de la place, les autres cachés.
  const cw = W / 6, ch = blockH * 0.52;
  for (const [i, c] of chars.entries()) {
    for (const o of chars) o.holder.visible = o === c;
    c.holder.position.set(0, 0, 2.0);
    const target = new THREE.Vector3(0, 0.95, 2.0);
    c.holder.rotation.y = 0; c.pose(false, 0);
    shot({ x: (i * 3) * cw, y: y0 + 34, w: cw, h: ch }, new THREE.Vector3(0, 1.1, 5.8), target);
    shot({ x: (i * 3 + 1) * cw, y: y0 + 34, w: cw, h: ch }, new THREE.Vector3(0, 1.1, -1.4), target);
    c.pose(true, 0.35); c.holder.rotation.y = Math.PI / 2;
    shot({ x: (i * 3 + 2) * cw, y: y0 + 34, w: cw, h: ch }, new THREE.Vector3(2.6, 1.1, 4.8), target);
    const name = ['face', 'dos', 'marche'];
    for (let j = 0; j < 3; j += 1) labels.push([`${['1', '2'][i]}: ${name[j]}`, (i * 3 + j) * cw + 8, y0 + 38, 14]);
  }
  // Mise en scène: l'un marche vers le banc, l'autre se tient devant.
  for (const c of chars) c.holder.visible = true;
  chars[0].holder.position.set(-0.6, 0, -0.6); chars[0].holder.rotation.y = 0.5; chars[0].pose(true, 0.2);
  chars[1].holder.position.set(0.7, 0, -0.9); chars[1].holder.rotation.y = -0.3; chars[1].pose(false, 0);
  const sy = y0 + 34 + ch + 4, sh = blockH - ch - 42;
  // Vue du jeu actuelle: caméra haute à 35 degrés, de loin (personnage de 90 px environ à 1366 x 768).
  const look = new THREE.Vector3(0, 0.6, -0.8);
  const dir = new THREE.Vector3(0, Math.sin(THREE.MathUtils.degToRad(35)), Math.cos(THREE.MathUtils.degToRad(35)));
  shot({ x: 0, y: sy, w: W / 2, h: sh }, look.clone().addScaledVector(dir, 14), look, 22);
  // Vue proche derrière le personnage 1, à hauteur d'épaule.
  // Le personnage 1 marche vers le banc: caméra derrière lui, à hauteur d'épaule, un peu sur le côté.
  chars[0].holder.rotation.y = Math.PI - 0.35;
  chars[0].holder.position.set(-0.3, 0, 0.6);
  const p = chars[0].holder.position;
  const f = new THREE.Vector3(Math.sin(chars[0].holder.rotation.y), 0, Math.cos(chars[0].holder.rotation.y));
  const right = new THREE.Vector3(f.z, 0, -f.x);
  shot({ x: W / 2, y: sy, w: W / 2, h: sh }, p.clone().addScaledVector(f, -1.9).addScaledVector(right, -0.45).setY(1.75), p.clone().addScaledVector(f, 3).setY(0.9), 50);
  labels.push(['vue du jeu (caméra haute, 35 degrés)', 8, sy + 4, 14], ['vue proche derrière le personnage', W / 2 + 8, sy + 4, 14]);
  for (const c of chars) scene.remove(c.holder);
}
const sheet = document.createElement('canvas');
sheet.width = W; sheet.height = H;
const ctx = sheet.getContext('2d');
ctx.fillStyle = '#efe9dd'; ctx.fillRect(0, 0, W, H);
ctx.drawImage(renderer.domElement, 0, 0);
for (const [text, x, y, size] of labels) { ctx.font = `bold ${size}px sans-serif`; ctx.fillStyle = 'rgba(239,233,221,0.85)'; const w = ctx.measureText(text).width; ctx.fillRect(x - 4, y - 2, w + 8, size + 6); ctx.fillStyle = '#2b2523'; ctx.textBaseline = 'top'; ctx.fillText(text, x, y); }
window.banc = { pret: true, mesures, image: sheet.toDataURL('image/png') };
</script>
</body>
</html>
