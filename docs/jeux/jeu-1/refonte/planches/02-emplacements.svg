<text x="1218.0" y="88.0" font-family="DejaVu Sans" font-size="17" font-weight="bold" text-anchor="start" fill="#44618A" >hat (chapeau, coiffe)</text>
<text x="1218.0" y="108.0" font-family="DejaVu Sans" font-size="13.5" font-weight="normal" text-anchor="start" fill="#44618A" >posé sur la calotte commune</text>
<line x1="662.0" y1="186.5" x2="450" y2="186.5" stroke="#44618A" stroke-width="1.3"/>
<circle cx="662.0" cy="186.5" r="4" fill="#44618A"/>
<text x="442.0" y="184.5" font-family="DejaVu Sans" font-size="17" font-weight="bold" text-anchor="end" fill="#44618A" >ligne de chapeau: 1,58 m</text>
<text x="442.0" y="204.5" font-family="DejaVu Sans" font-size="13.5" font-weight="normal" text-anchor="end" fill="#44618A" >au-dessus, même crâne pour toutes les têtes</text>
<line x1="774.0" y1="134.8" x2="450" y2="94.8" stroke="#2B2A33" stroke-width="1.3"/>
<circle cx="774.0" cy="134.8" r="4" fill="#2B2A33"/>
<text x="442.0" y="92.8" font-family="DejaVu Sans" font-size="17" font-weight="bold" text-anchor="end" fill="#2B2A33" >hair (cheveux)</text>
<text x="442.0" y="112.8" font-family="DejaVu Sans" font-size="13.5" font-weight="normal" text-anchor="end" fill="#2B2A33" >variante « _hat » rasée au-dessus de la ligne</text>
<line x1="869.2" y1="224.6" x2="1210" y2="224.6" stroke="#2B2A33" stroke-width="1.3"/>
<circle cx="869.2" cy="224.6" r="4" fill="#2B2A33"/>
<text x="1218.0" y="222.6" font-family="DejaVu Sans" font-size="17" font-weight="bold" text-anchor="start" fill="#2B2A33" >glasses (lunettes)</text>
<text x="1218.0" y="242.6" font-family="DejaVu Sans" font-size="13.5" font-weight="normal" text-anchor="start" fill="#2B2A33" >branches sur les oreilles, pont sur le nez</text>
<line x1="818.8" y1="261.0" x2="450" y2="291.0" stroke="#2B2A33" stroke-width="1.3"/>
<circle cx="818.8" cy="261.0" r="4" fill="#2B2A33"/>
<text x="442.0" y="289.0" font-family="DejaVu Sans" font-size="17" font-weight="bold" text-anchor="end" fill="#2B2A33" >head, nose, eyes, brows, mouth</text>
<text x="442.0" y="309.0" font-family="DejaVu Sans" font-size="13.5" font-weight="normal" text-anchor="end" fill="#2B2A33" >tête en relief, pièces du visage</text>
<line x1="863.6" y1="297.2" x2="1210" y2="311.2" stroke="#2B2A33" stroke-width="1.3"/>
<circle cx="863.6" cy="297.2" r="4" fill="#2B2A33"/>
<text x="1218.0" y="309.2" font-family="DejaVu Sans" font-size="17" font-weight="bold" text-anchor="start" fill="#2B2A33" >facial_hair (barbe, moustache)</text>
<text x="1218.0" y="329.2" font-family="DejaVu Sans" font-size="13.5" font-weight="normal" text-anchor="start" fill="#2B2A33" ></text>
<line x1="919.6" y1="328.0" x2="1210" y2="354.0" stroke="#8F3B34" stroke-width="1.3"/>
<circle cx="919.6" cy="328.0" r="4" fill="#8F3B34"/>
<text x="1218.0" y="352.0" font-family="DejaVu Sans" font-size="17" font-weight="bold" text-anchor="start" fill="#8F3B34" >couture du col</text>
<text x="1218.0" y="372.0" font-family="DejaVu Sans" font-size="13.5" font-weight="normal" text-anchor="start" fill="#8F3B34" >le col du haut recouvre la base du cou</text>
<line x1="802.0" y1="353.2" x2="450" y2="363.2" stroke="#2B2A33" stroke-width="1.3"/>
<circle cx="802.0" cy="353.2" r="4" fill="#2B2A33"/>
<text x="442.0" y="361.2" font-family="DejaVu Sans" font-size="17" font-weight="bold" text-anchor="end" fill="#2B2A33" >neck (écharpe, foulard, cravate)</text>
<text x="442.0" y="381.2" font-family="DejaVu Sans" font-size="13.5" font-weight="normal" text-anchor="end" fill="#2B2A33" ></text>
<line x1="886.0" y1="403.6" x2="1210" y2="433.6" stroke="#2B2A33" stroke-width="1.3"/>
<circle cx="886.0" cy="403.6" r="4" fill="#2B2A33"/>
<text x="1218.0" y="431.6" font-family="DejaVu Sans" font-size="17" font-weight="bold" text-anchor="start" fill="#2B2A33" >top (haut), puis outer (veste) par-dessus</text>
<text x="1218.0" y="451.6" font-family="DejaVu Sans" font-size="13.5" font-weight="normal" text-anchor="start" fill="#2B2A33" >couche 1: 1 à 2,5 cm; couche 2: 2,5 à 5 cm</text>
<line x1="734.8" y1="437.2" x2="450" y2="437.2" stroke="#2B2A33" stroke-width="1.3"/>
<circle cx="734.8" cy="437.2" r="4" fill="#2B2A33"/>
<text x="442.0" y="435.2" font-family="DejaVu Sans" font-size="17" font-weight="bold" text-anchor="end" fill="#2B2A33" >back (sac à dos), side (besace)</text>
<text x="442.0" y="455.2" font-family="DejaVu Sans" font-size="13.5" font-weight="normal" text-anchor="end" fill="#2B2A33" >sangles moulées sur la couche portée</text>
<line x1="981.2" y1="519.7" x2="1210" y2="519.7" stroke="#8F3B34" stroke-width="1.3"/>
<circle cx="981.2" cy="519.7" r="4" fill="#8F3B34"/>
<text x="1218.0" y="517.7" font-family="DejaVu Sans" font-size="17" font-weight="bold" text-anchor="start" fill="#8F3B34" >couture de la taille</text>
<text x="1218.0" y="537.7" font-family="DejaVu Sans" font-size="13.5" font-weight="normal" text-anchor="start" fill="#8F3B34" >le haut tombe 5 cm sous la taille, ou la ceinture monte</text>
<line x1="751.6" y1="558.9" x2="450" y2="570.9" stroke="#2B2A33" stroke-width="1.3"/>
<circle cx="751.6" cy="558.9" r="4" fill="#2B2A33"/>
<text x="442.0" y="568.9" font-family="DejaVu Sans" font-size="17" font-weight="bold" text-anchor="end" fill="#2B2A33" >waist (tablier, ceinture, banane)</text>
<text x="442.0" y="588.9" font-family="DejaVu Sans" font-size="13.5" font-weight="normal" text-anchor="end" fill="#2B2A33" ></text>
<line x1="1005.1" y1="603.0" x2="1210" y2="649.0" stroke="#8F3B34" stroke-width="1.3"/>
<circle cx="1005.1" cy="603.0" r="4" fill="#8F3B34"/>
<text x="1218.0" y="647.0" font-family="DejaVu Sans" font-size="17" font-weight="bold" text-anchor="start" fill="#8F3B34" >couture des poignets</text>
<text x="1218.0" y="667.0" font-family="DejaVu Sans" font-size="13.5" font-weight="normal" text-anchor="start" fill="#8F3B34" >bord de manche épais; la main est toujours du corps</text>
<line x1="774.0" y1="701.0" x2="450" y2="701.0" stroke="#2B2A33" stroke-width="1.3"/>
<circle cx="774.0" cy="701.0" r="4" fill="#2B2A33"/>
<text x="442.0" y="699.0" font-family="DejaVu Sans" font-size="17" font-weight="bold" text-anchor="end" fill="#2B2A33" >bottom (pantalon, short, jupe, salopette)</text>
<text x="442.0" y="719.0" font-family="DejaVu Sans" font-size="13.5" font-weight="normal" text-anchor="end" fill="#2B2A33" >une robe occupe « top » et « bottom »</text>
<line x1="908.4" y1="811.6" x2="1210" y2="811.6" stroke="#2B2A33" stroke-width="1.3"/>
<circle cx="908.4" cy="811.6" r="4" fill="#2B2A33"/>
<text x="1218.0" y="809.6" font-family="DejaVu Sans" font-size="17" font-weight="bold" text-anchor="start" fill="#2B2A33" >genou: 0,46 m</text>
<text x="1218.0" y="829.6" font-family="DejaVu Sans" font-size="13.5" font-weight="normal" text-anchor="start" fill="#2B2A33" >longueurs: short au-dessus, jupe midi dessous</text>
<line x1="981.2" y1="1014.0" x2="1210" y2="1006.0" stroke="#8F3B34" stroke-width="1.3"/>
<circle cx="981.2" cy="1014.0" r="4" fill="#8F3B34"/>
<text x="1218.0" y="1004.0" font-family="DejaVu Sans" font-size="17" font-weight="bold" text-anchor="start" fill="#8F3B34" >couture des chevilles</text>
<text x="1218.0" y="1024.0" font-family="DejaVu Sans" font-size="13.5" font-weight="normal" text-anchor="start" fill="#8F3B34" >le bas tombe sur la chaussure, ou la botte monte</text>
<line x1="774.0" y1="1044.8" x2="450" y2="1038.8" stroke="#2B2A33" stroke-width="1.3"/>
<circle cx="774.0" cy="1044.8" r="4" fill="#2B2A33"/>
<text x="442.0" y="1036.8" font-family="DejaVu Sans" font-size="17" font-weight="bold" text-anchor="end" fill="#2B2A33" >shoes (chaussures)</text>
<text x="442.0" y="1056.8" font-family="DejaVu Sans" font-size="13.5" font-weight="normal" text-anchor="end" fill="#2B2A33" >le pied nu n'existe pas hors de l'éditeur</text>
<text x="1930.0" y="110.0" font-family="DejaVu Sans" font-size="20" font-weight="bold" text-anchor="middle" fill="#2B2A33" >Coupe du torse vue du dessus: les couches</text>
<ellipse cx="1930" cy="300" rx="182" ry="118" fill="#B9B7B0" stroke="#2B2A33" stroke-width="2"/>
<rect x="1740" y="446" width="22" height="18" fill="#B9B7B0" stroke="#2B2A33" stroke-width="1.5"/>
<text x="1772.0" y="460.0" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="start" fill="#2B2A33" >sangle de sac: + 5 à 6 cm</text>
<ellipse cx="1930" cy="300" rx="166" ry="104" fill="#587F8E" stroke="#2B2A33" stroke-width="2"/>
<rect x="1740" y="476" width="22" height="18" fill="#587F8E" stroke="#2B2A33" stroke-width="1.5"/>
<text x="1772.0" y="490.0" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="start" fill="#2B2A33" >couche 2, outer: + 2,5 à 5 cm</text>
<ellipse cx="1930" cy="300" rx="148" ry="88" fill="#D4A33E" stroke="#2B2A33" stroke-width="2"/>
<rect x="1740" y="506" width="22" height="18" fill="#D4A33E" stroke="#2B2A33" stroke-width="1.5"/>
<text x="1772.0" y="520.0" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="start" fill="#2B2A33" >couche 1, top: + 1 à 2,5 cm</text>
<ellipse cx="1930" cy="300" rx="132" ry="74" fill="#E0AE86" stroke="#2B2A33" stroke-width="2"/>
<rect x="1740" y="536" width="22" height="18" fill="#E0AE86" stroke="#2B2A33" stroke-width="1.5"/>
<text x="1772.0" y="550.0" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="start" fill="#2B2A33" >corps (masqué sous le vêtement)</text>
<text x="1930.0" y="306.0" font-family="DejaVu Sans" font-size="14" font-weight="normal" text-anchor="middle" fill="#2B2A33" >corps</text>
<text x="1740.0" y="630.0" font-family="DejaVu Sans" font-size="17" font-weight="bold" text-anchor="start" fill="#2B2A33" >Règles d'emboîtement</text>
<text x="1740.0" y="657.0" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="start" fill="#2B2A33" >1. Chaque pièce tient dans le volume de son emplacement.</text>
<text x="1740.0" y="684.0" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="start" fill="#2B2A33" >2. Une pièce masque les sections du corps qu'elle couvre</text>
<text x="1740.0" y="711.0" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="start" fill="#2B2A33" >   (torse, bras, avant-bras, bassin, cuisses, jambes).</text>
<text x="1740.0" y="738.0" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="start" fill="#2B2A33" >3. Une couture est toujours cachée par un bord épais:</text>
<text x="1740.0" y="765.0" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="start" fill="#2B2A33" >   col, ourlet, poignet, revers, tige de botte.</text>
<text x="1740.0" y="792.0" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="start" fill="#2B2A33" >4. Au-dessus de la ligne de chapeau, toutes les têtes ont</text>
<text x="1740.0" y="819.0" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="start" fill="#2B2A33" >   le même crâne: tout chapeau va à tout le monde.</text>
<text x="1740.0" y="846.0" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="start" fill="#2B2A33" >5. Mains, cou et tête ne sont jamais couverts par un haut:</text>
<text x="1740.0" y="873.0" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="start" fill="#2B2A33" >   gants, cols roulés et capuches sont des pièces à part.</text>
<text x="1740.0" y="900.0" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="start" fill="#2B2A33" >6. Couleurs par emplacement de couleur (principale,</text>
<text x="1740.0" y="927.0" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="start" fill="#2B2A33" >   secondaire, motif), jamais par texture.</text>
<text x="1740.0" y="1010.0" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="start" fill="#8F3B34" >Rouge: coutures cachées. Bleu: calotte commune.</text>
<text x="1740.0" y="1036.0" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="start" fill="#2B2A33" >Pose de référence des pièces: bras écartés à 40 degrés</text>
<text x="1740.0" y="1058.0" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="start" fill="#2B2A33" >(pose en A), à confirmer par l'essai du tech-artist.</text>
</svg>
