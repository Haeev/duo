<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>La Petite Ligne, refonte: basse-cour</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="refonte.css">
<style>
  body { background: #9cba6a; }
  .world { position: fixed; left: 50%; top: 50%; width: 1366px; height: 768px; margin: -384px 0 0 -683px; z-index: 5; }
  .scene svg { animation: camera var(--d-scene) var(--ease) both; }
  @keyframes camera { from { transform: scale(0.82) translateY(3rem); opacity: 0.4; } }
  .poule { transform-box: fill-box; transform-origin: 50% 100%; animation: picore 1.6s ease-in-out infinite; }
  .poule:nth-of-type(2) { animation-delay: -0.5s; } .poule:nth-of-type(3) { animation-delay: -1.1s; } .poule:nth-of-type(4) { animation-delay: -0.8s; }
  @keyframes picore { 0%, 60%, 100% { transform: rotate(0); } 75% { transform: rotate(9deg); } 88% { transform: rotate(-3deg); } }

  /* Pastille de zone: l'état se lit d'un coup d'œil (jours de grain, œufs). */
  .zone {
    position: absolute; transform: translate(-50%, -100%); z-index: 11; display: inline-flex; align-items: center; gap: 0.5rem;
    padding: 0.25rem 0.875rem 0.25rem 0.25rem; background: var(--paper-raised); border: 0.125rem solid var(--ink); border-radius: 62rem;
    box-shadow: var(--shadow-2); font-family: var(--font-display); font-size: 1.5rem; font-weight: 650; line-height: 1; white-space: nowrap;
  }
  .zone small { font-family: var(--font-text); font-size: 0.875rem; font-weight: 800; }
  .zone .need { animation: none; width: 2.75rem; height: 2.75rem; box-shadow: none; }
  .zone--egg { padding-left: 0.625rem; }
  .zone--egg .ic { width: 2rem; height: 2rem; }
  .zone--alert { border-style: dashed; border-color: var(--stamp); }
  .prompt--big { font-size: 1.125rem; padding: 0.4375rem 1rem 0.4375rem 0.5rem; }
  .prompt--big .ic { width: 1.75rem; height: 1.75rem; }
  .heart-up { position: absolute; z-index: 11; color: var(--stamp); animation: coeur 2.2s var(--ease) infinite; }
  .heart-up .ic { width: 1.75rem; height: 1.75rem; }
  @keyframes coeur { 0% { opacity: 0; transform: translateY(0.5rem) scale(0.4); } 20%, 70% { opacity: 1; transform: translateY(-0.75rem) scale(1); } 100% { opacity: 0; transform: translateY(-2rem) scale(1); } }

  .cards { position: fixed; left: 50%; bottom: 0.75rem; z-index: 20; transform: translateX(-50%); display: flex; gap: 0.5rem; padding: 0.5rem; background: var(--wood-deep); border: 0.125rem solid var(--ink); border-radius: 1rem; box-shadow: var(--shadow-2); }
  .hen {
    position: relative; display: grid; grid-template-columns: auto auto; align-items: center; column-gap: 0.5rem; width: 10.25rem; height: 4.5rem; padding: 0 0.625rem 0 0.375rem;
    background: var(--paper-raised); border: 0.125rem solid var(--ink); border-radius: 0.75rem; text-align: left;
  }
  .hen > svg { width: 3.25rem; height: 3.25rem; grid-row: span 2; }
  .hen__name { font-family: var(--font-display); font-size: 1.0625rem; font-weight: 650; line-height: 1.1; align-self: end; }
  .hen .hearts { align-self: start; }
  .hen .hearts .ic { width: 0.875rem; height: 0.875rem; }
  .hen__egg { position: absolute; right: -0.375rem; top: -0.5rem; width: 1.625rem; height: 1.625rem; display: grid; place-items: center; background: var(--paper-raised); border: 0.125rem solid var(--ink); border-radius: 50%; }
  .hen__egg .ic { width: 1rem; height: 1rem; }
  .hen--free { width: 4.5rem; padding: 0; place-items: center; grid-template-columns: 1fr; background: transparent; border: 0.125rem dashed var(--brass); color: var(--brass); }
  .hen--free svg { grid-row: auto; width: 1.75rem; height: 1.75rem; }
  .keys { position: fixed; right: 0.75rem; top: 0.75rem; z-index: 20; display: flex; gap: 0.875rem; padding: 0.375rem 0.75rem; background: var(--paper-raised); border: 0.125rem solid var(--ink); border-radius: 62rem; font-size: 0.8125rem; font-weight: 750; }
  .keys span { display: inline-flex; align-items: center; gap: 0.3125rem; }
  .keys .ic { width: 1.125rem; height: 1.125rem; }
  .states { position: fixed; right: 0.75rem; bottom: 0.5rem; z-index: 60; display: flex; gap: 0.375rem; font-size: 0.75rem; font-weight: 750; }
  .states a { padding: 0.125rem 0.5rem; background: var(--paper-raised); border: 0.0625rem dashed var(--ink); border-radius: 0.25rem; color: var(--ink); text-decoration: none; }
</style>
</head>
<body data-defaut="normal">
<!-- La scène 3D du jeu, vue en coupe comme une maison de poupée (ici figurée en dessin). -->
<div class="scene" id="scene"></div>

<div class="hud-clock" role="status" aria-label="Mardi 5, soleil, 10 h 40. Bourse : 214.">
  <div class="dial"><div class="dial__sun"></div></div>
  <div>
    <div class="hud-clock__day"><i data-i="soleil"></i> mar. 5</div>
    <div class="hud-clock__time">10&nbsp;h&nbsp;40</div>
  </div>
  <div class="purse"><span class="coin"></span>214</div>
</div>

<div class="world">
  <!-- Zone 1: la mangeoire. Un seul grain, et le temps qu'il reste. -->
  <div data-si="normal">
    <div class="target-ring" style="left:300px;top:440px;width:190px;height:190px"></div>
    <button class="zone" style="left:300px;top:272px" aria-label="Mangeoire : 3 jours de grain"><span class="need" style="--val:45"><i data-i="grain"></i></span>3 <small>jours</small></button>
    <div class="prompt prompt--big" style="left:300px;top:338px"><span class="key">Espace</span><i data-i="grain"></i>Remplir</div>
    <button class="zone zone--egg" style="left:1068px;top:300px" aria-label="Nid : 4 œufs à ramasser"><i data-i="oeuf"></i>4</button>
    <div class="heart-up" style="left:584px;top:500px" aria-hidden="true"><i data-i="coeur"></i></div>
  </div>
  <div data-si="vide">
    <div class="target-ring" style="left:300px;top:440px;width:190px;height:190px"></div>
    <button class="zone zone--alert" style="left:300px;top:272px" aria-label="Mangeoire vide"><span class="need need--low" style="--val:3"><i data-i="grain"></i></span>0 <small>jour</small></button>
    <div class="prompt prompt--big" style="left:300px;top:338px"><span class="key">Espace</span><i data-i="grain"></i>Remplir</div>
    <button class="zone zone--egg" style="left:1068px;top:300px;color:var(--ink-muted);border-style:dashed" aria-label="Nid vide"><i data-i="oeuf" style="opacity:.45"></i>0</button>
    <div class="emote" style="left:598px;top:510px" aria-hidden="true">??</div>
    <div class="emote" style="left:876px;top:498px;animation-delay:-0.6s" aria-hidden="true">??</div>
  </div>
</div>

<div class="keys" aria-label="Touches"><span><span class="key">Q</span><span class="key">D</span> zone voisine</span><span><span class="key">Retour</span><i data-i="sortie"></i></span></div>

<!-- Une carte par poule: nom, cœur, a pondu aujourd'hui. Places libres en pointillé. -->
<div class="cards" role="list" aria-label="Tes poules">
  <button class="hen" role="listitem" aria-label="Bichette, 4 cœurs sur 5, a pondu"><i data-i="poule"></i><span class="hen__name">Bichette</span><span class="hearts"><i data-i="coeur"></i><i data-i="coeur"></i><i data-i="coeur"></i><i data-i="coeur"></i><i data-i="coeur" class="ic off"></i></span><span class="hen__egg" data-si="normal"><i data-i="oeuf"></i></span></button>
  <button class="hen" role="listitem" aria-label="Noisette, 3 cœurs sur 5, a pondu"><i data-i="poule"></i><span class="hen__name">Noisette</span><span class="hearts"><i data-i="coeur"></i><i data-i="coeur"></i><i data-i="coeur"></i><i data-i="coeur" class="ic off"></i><i data-i="coeur" class="ic off"></i></span><span class="hen__egg" data-si="normal"><i data-i="oeuf"></i></span></button>
  <button class="hen" role="listitem" aria-label="Plume, 2 cœurs sur 5, a pondu"><i data-i="poule"></i><span class="hen__name">Plume</span><span class="hearts"><i data-i="coeur"></i><i data-i="coeur"></i><i data-i="coeur" class="ic off"></i><i data-i="coeur" class="ic off"></i><i data-i="coeur" class="ic off"></i></span><span class="hen__egg" data-si="normal"><i data-i="oeuf"></i></span></button>
  <button class="hen" role="listitem" aria-label="Griotte, 1 cœur sur 5"><i data-i="poule"></i><span class="hen__name">Griotte</span><span class="hearts"><i data-i="coeur"></i><i data-i="coeur" class="ic off"></i><i data-i="coeur" class="ic off"></i><i data-i="coeur" class="ic off"></i><i data-i="coeur" class="ic off"></i></span></button>
  <div class="hen hen--free" role="listitem" aria-label="Place libre"><i data-i="plus"></i></div>
  <div class="hen hen--free" role="listitem" aria-label="Place libre"><i data-i="plus"></i></div>
</div>

<div class="provisoire">Maquette : scène 3D figurée</div>
<nav class="states" aria-label="États de la maquette"><a href="#normal">grain et œufs</a><a href="#vide">mangeoire vide</a></nav>

<script>
  // Poulailler en coupe, dessiné (tient lieu de la scène 3D). Le niveau de grain suit l'état.
  (function () {
    var vide = location.hash === '#vide';
    var K = 'stroke="#2a2522" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"';
    function poule(x, y, s, corps, sens) {
      return '<g transform="translate(' + x + ' ' + y + ') scale(' + (sens * s) + ' ' + s + ')"><g class="poule" ' + K + '>' +
        '<path d="M-8 0v22M10 0v22M-16 22h12M4 22h12" fill="none" stroke="#c98a2b"/>' +
        '<path d="M-50 -40c-14 -22 -6 -40 6 -36c6 14 14 22 24 26z" fill="' + corps + '"/>' +
        '<ellipse cx="0" cy="-30" rx="46" ry="36" fill="' + corps + '"/>' +
        '<circle cx="38" cy="-66" r="22" fill="' + corps + '"/>' +
        '<path d="M30 -86c2 -12 12 -12 12 -2c6 -8 14 -2 8 8z" fill="#c9483f"/>' +
        '<path d="M58 -66l18 6l-18 6z" fill="#f4c542"/><circle cx="44" cy="-70" r="3.500" fill="#2a2522" stroke="none"/>' +
        '<path d="M-22 -34q18 22 40 0" fill="none"/></g></g>';
    }
    function oeuf(x, y) { return '<ellipse cx="' + x + '" cy="' + y + '" rx="13" ry="17" fill="#fbf1dc" ' + K + '/>'; }
    var planches = '';
    for (var i = 0; i < 9; i++) planches += '<path d="M' + (150 + i * 120) + ' 250v330" stroke="#b98b55" stroke-width="3"/>';
    var grain = vide ? '' : '<path d="M248 330h104l-14 84h-76z" fill="#e2b84a" stroke="none"/><path d="M228 506q72 -26 144 0z" fill="#e2b84a" ' + K + '/>';
    var oeufs = vide ? '' : oeuf(985, 468) + oeuf(1012, 474) + oeuf(1085, 470) + oeuf(1168, 472);
    document.getElementById('scene').innerHTML =
      '<svg viewBox="0 0 1366 768" preserveAspectRatio="xMidYMid slice" aria-hidden="true">' +
      '<rect width="1366" height="768" fill="#a9d3e6"/><path d="M0 330q340 -50 700 -16t666 -24V768H0z" fill="#9cba6a"/>' +
      '<g ' + K + '>' +
      // Le pan de toit du fond: celui de devant est retiré pour voir dedans (coupe).
      '<path d="M84 250h1198l-110 -112H194z" fill="#a4463b"/><path d="M194 138h978" fill="none" stroke-width="8"/>' +
      '<path d="M110 250h1146v340H110z" fill="#d3a66d"/>' + planches +
      '<path d="M70 590h1226l40 110H30z" fill="#e8cf8a"/>' +
      '<path d="M110 250v340l-40 0v-300zM1256 250v340l40 0v-300z" fill="#a97749"/>' +

      // Fenêtre
      '<rect x="560" y="290" width="150" height="110" rx="8" fill="#bfe0ee"/><path d="M635 290v110M560 345h150" fill="none"/>' +
      // Mangeoire à trémie: le niveau de grain se voit
      '<path d="M236 300h128l-22 130h-84z" fill="#fbf6e9" fill-opacity=".75"/>' + grain +
      '<path d="M236 300h128l-22 130h-84z" fill="none"/><rect x="226" y="286" width="148" height="18" rx="6" fill="#765130"/>' +
      '<path d="M200 506h200l-16 44H216z" fill="#765130"/>' +
      // Nid: trois cases garnies de paille
      '<path d="M940 380h270v130H940z" fill="#8a5a33"/><path d="M1030 380v130M1120 380v130" fill="none"/>' +
      '<path d="M948 496q36 -34 74 0zM1038 496q36 -34 74 0zM1128 496q36 -34 74 0z" fill="#e8cf8a"/>' + oeufs +
      '<path d="M930 510h290v22H930z" fill="#765130"/><path d="M950 532v60M1200 532v60" stroke-width="10" stroke="#765130"/>' +
      '</g>' +
      // Paille au sol
      '<g stroke="#c9a94e" stroke-width="3" fill="none"><path d="M180 640l40 -10M420 660l50 6M700 630l44 -8M930 664l50 -6M1150 640l40 8M560 690l40 -6"/></g>' +
      poule(560, 615, 1.0, '#fbf1dc', 1) + poule(730, 640, 1.1, '#c98a55', -1) + poule(840, 600, 0.95, '#5b4d40', 1) + poule(410, 622, 0.9, '#e2b06a', -1) +
      '</svg>';
    window.addEventListener('hashchange', function () { location.reload(); });
  })();
</script>
<script src="commun.js"></script>
</body>
</html>
