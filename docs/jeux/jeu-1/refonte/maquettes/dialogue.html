<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>La Petite Ligne, refonte: dialogue</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="refonte.css">
<style>
  .scene svg { transform: scale(1.5); transform-origin: 66% 52%; } /* la caméra se rapproche de l'habitant */
  .dlg {
    position: fixed; left: 50%; bottom: 1rem; z-index: 30; width: min(65rem, calc(100% - 2rem)); height: 10.5rem;
    margin-left: max(-32.5rem, calc(-50% + 1rem));
    background: var(--paper-raised); border: 0.1875rem solid var(--ink); border-radius: 1.25rem; box-shadow: var(--shadow-3);
    animation: bandeau var(--d-slow) var(--ease) both;
  }
  @keyframes bandeau { from { transform: translateY(120%); } to { transform: translateY(0); } }
  .dlg__bust {
    position: absolute; left: 1.5rem; bottom: 0; width: 11.875rem; height: 14.25rem; overflow: hidden;
    animation: buste var(--d-slow) var(--ease-bounce) 80ms both;
  }
  .dlg__bust svg { display: block; width: 100%; height: 100%; }
  .dlg__bust::after {
    content: '3D figurée'; position: absolute; right: 0; top: 3.5rem; padding: 0 0.3125rem; border: 0.0625rem dashed var(--ink);
    border-radius: 0.1875rem; font-size: 0.6875rem; font-weight: 750; line-height: 1.4;
    background: repeating-linear-gradient(135deg, #fbf6e9 0 0.25rem, #e6dabd 0.25rem 0.5rem);
  }
  @keyframes buste { from { transform: translateY(40%) scale(0.9); opacity: 0; } to { transform: none; opacity: 1; } }
  .parle .bouche { transform-box: fill-box; transform-origin: center; animation: babil 0.24s ease-in-out infinite alternate; }
  @keyframes babil { from { transform: scaleY(0.25); } to { transform: scaleY(1); } }
  .dlg__plate {
    position: absolute; left: 14.25rem; top: -1.25rem; z-index: 2; display: flex; align-items: center; gap: 0.5rem;
    padding: 0.25rem 0.75rem; background: var(--wood-deep); color: var(--on-wood); border: 0.125rem solid var(--ink);
    border-radius: 0.625rem; box-shadow: var(--shadow-1); font-family: var(--font-display); font-size: 1.125rem; font-weight: 650;
    transform: rotate(-2deg);
  }
  .dlg__plate .hearts { color: #e58f7c; }
  .dlg__plate .hearts .off { color: var(--on-wood); opacity: 0.55; }
  .dlg__text { position: absolute; left: 15rem; right: 2rem; top: 1.75rem; margin: 0; font-size: 1.125rem; line-height: 1.55; font-weight: 600; }
  .dlg__text b { color: var(--focus); font-weight: 850; text-decoration: underline; text-decoration-thickness: 0.125rem; text-underline-offset: 0.1875rem; }
  .dlg__text .c { opacity: 0; }
  .dlg__text .c.on { opacity: 1; }
  .dlg__next { position: absolute; right: 1.25rem; bottom: 0.75rem; display: flex; align-items: center; gap: 0.5rem; }
  .dlg__next i { width: 0; height: 0; border: 0.5rem solid transparent; border-top: 0.6875rem solid var(--ink); border-bottom: 0; animation: suite 0.7s ease-in-out infinite alternate; }
  @keyframes suite { to { transform: translateY(0.3125rem); } }
  .choices { position: fixed; z-index: 31; right: max(1.5rem, calc(50% - 31.5rem)); bottom: 12.25rem; display: grid; gap: 0.5rem; justify-items: end; }
  .choice {
    display: inline-flex; align-items: center; gap: 0.5rem; min-height: 2.75rem; padding: 0 1rem 0 0.75rem;
    background: var(--paper-raised); border: 0.125rem solid var(--ink); border-radius: 0.75rem; box-shadow: var(--shadow-2);
    font-size: 1.0625rem; font-weight: 750; animation: choix var(--d-base) var(--ease-bounce) both;
  }
  .choice:nth-child(2) { animation-delay: 60ms; }
  .choice:nth-child(3) { animation-delay: 120ms; }
  .choice.focus { background: var(--ink); color: var(--paper-raised); transform: translateX(-0.5rem); }
  .choice.focus::before { content: '▶'; font-size: 0.75rem; }
  @keyframes choix { from { opacity: 0; transform: translateX(2rem); } }
  .choice.focus { animation-name: choixf; }
  @keyframes choixf { from { opacity: 0; transform: translateX(2rem); } to { opacity: 1; transform: translateX(-0.5rem); } }
  .states { position: fixed; right: 0.75rem; top: 0.5rem; z-index: 60; display: flex; gap: 0.375rem; font-size: 0.75rem; font-weight: 750; }
  .states a { padding: 0.125rem 0.5rem; background: var(--paper-raised); border: 0.0625rem dashed var(--ink); border-radius: 0.25rem; color: var(--ink); text-decoration: none; }
</style>
</head>
<body data-defaut="parle">
<div class="scene" data-scene="bourg"></div>

<div class="hud-clock" role="status" aria-label="Mardi 5, soleil, 10 h 40. Bourse : 214.">
  <div class="dial"><div class="dial__sun"></div></div>
  <div>
    <div class="hud-clock__day"><i data-i="soleil"></i> mar. 5</div>
    <div class="hud-clock__time">10&nbsp;h&nbsp;40</div>
  </div>
  <div class="purse"><span class="coin"></span>214</div>
</div>

<div class="choices" data-si="choix" role="listbox" aria-label="Ta réponse">
  <button class="choice focus" role="option" aria-selected="true"><i data-i="plume"></i>Treize&nbsp;? Raconte-moi.</button>
  <button class="choice" role="option"><i data-i="cadeau"></i>Tiens, c'est pour toi.</button>
  <button class="choice" role="option">Je repasserai.</button>
</div>

<section class="dlg" aria-label="Odette te parle">
  <div class="dlg__bust" id="buste" data-buste="odette" data-parle></div>
  <div class="dlg__plate">Odette
    <span class="hearts" role="img" aria-label="Amitié : 2 cœurs sur 5"><i data-i="coeur"></i><i data-i="coeur"></i><i data-i="coeur" class="ic off"></i><i data-i="coeur" class="ic off"></i><i data-i="coeur" class="ic off"></i></span>
  </div>
  <p class="dlg__text" id="texte" aria-live="polite">Ah, te voilà&nbsp;! Figure-toi que la <b>vieille horloge de la gare</b> s'est remise à sonner cette nuit. Treize coups, pas un de moins. Tu ne trouves pas ça étrange, toi&nbsp;?</p>
  <div class="dlg__next" id="suite"><span class="key">Espace</span><i></i></div>
</section>

<div class="provisoire" style="left:auto;right:0.75rem;bottom:auto;top:2.25rem">Maquette : décor et portrait 3D figurés</div>
<nav class="states" aria-label="États de la maquette"><a href="#parle">texte qui s'écrit</a><a href="#choix">choix</a></nav>

<script src="commun.js"></script>
<script>
  // Texte lettre par lettre: 40 caractères par seconde, pause après la ponctuation forte.
  (function () {
    var p = document.getElementById('texte');
    var buste = document.getElementById('buste');
    var suite = document.getElementById('suite');
    var lettres = [];
    (function decoupe(noeud) {
      Array.from(noeud.childNodes).forEach(function (n) {
        if (n.nodeType === 3) {
          var f = document.createDocumentFragment();
          n.textContent.split('').forEach(function (ch) {
            var s = document.createElement('span');
            s.className = 'c';
            s.textContent = ch;
            f.appendChild(s);
            lettres.push(s);
          });
          n.replaceWith(f);
        } else decoupe(n);
      });
    })(p);
    var i = 0;
    var minuteur;
    var reduit = document.documentElement.getAttribute('data-motion') === 'reduced';
    function fin() {
      clearTimeout(minuteur);
      lettres.forEach(function (s) { s.classList.add('on'); });
      i = lettres.length;
      buste.classList.remove('parle');
      suite.hidden = false;
    }
    function pas() {
      if (i >= lettres.length) return fin();
      var ch = lettres[i].textContent;
      lettres[i++].classList.add('on');
      minuteur = setTimeout(pas, /[.!?]/.test(ch) ? 175 : 25);
    }
    function depart(e) {
      clearTimeout(minuteur);
      lettres.forEach(function (s) { s.classList.remove('on'); });
      i = 0;
      if (e === 'choix' || reduit) return fin();
      suite.hidden = true;
      buste.classList.add('parle');
      minuteur = setTimeout(pas, 400);
    }
    document.addEventListener('etat', function (e) { depart(e.detail); });
    depart(document.body.getAttribute('data-etat'));
    // Espace: tout afficher, puis continuer (ici: les choix).
    document.addEventListener('keydown', function (e) {
      if (e.code !== 'Space' || e.repeat) return;
      e.preventDefault();
      if (i < lettres.length) fin();
      else location.hash = 'choix';
    });
  })();
</script>
</body>
</html>
