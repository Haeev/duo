<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>La Petite Ligne (refonte): l'interface en style encré</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1d1a17;
        font-family: system-ui, sans-serif;
      }
      /* Le fond: une capture du moteur, ou le pré provisoire peint à la main. */
      #fond {
        position: fixed;
        inset: 0;
        background-position: center;
        background-size: cover;
      }
      #fond svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      #fond[data-fond$='nuit'] svg {
        filter: brightness(0.5) saturate(0.7) hue-rotate(20deg);
      }
      .monde {
        position: fixed;
        left: 0.75rem;
        bottom: 0.375rem;
        z-index: 100;
        padding: 0 0.375rem;
        background: #fdf6e3;
        border: 1px dashed #1d1a17;
        font-size: 0.6875rem;
        font-weight: 700;
        color: #1d1a17;
      }
      .monde[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="fond"></div>
    <div id="ui"></div>
    <div class="monde" id="monde" hidden>Fond provisoire peint à la main</div>
    <script type="module" src="./demo.ts"></script>
  </body>
</html>
