<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>La Petite Ligne (refonte): démonstration de la pêche à deux</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #2a2522;
      }
      .moitie {
        position: absolute;
        top: 0;
        bottom: 0;
        width: calc(50% - 2px);
        overflow: hidden;
        /* L'interface se pose en `position: fixed`: chaque moitié en devient le cadre. */
        transform: translateZ(0);
      }
      #canne {
        left: 0;
      }
      #epuisette {
        right: 0;
      }
      .moitie canvas,
      .moitie .ui {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div class="moitie" id="canne">
      <canvas></canvas>
      <div class="ui"></div>
    </div>
    <div class="moitie" id="epuisette">
      <canvas></canvas>
      <div class="ui"></div>
    </div>
    <script type="module" src="./a-deux.ts"></script>
  </body>
</html>
