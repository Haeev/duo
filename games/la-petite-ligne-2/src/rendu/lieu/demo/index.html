<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>La Petite Ligne (refonte): grands lieux par tuiles</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1d2433;
        font:
          13px/1.45 system-ui,
          sans-serif;
      }
      #scene {
        display: block;
        width: 100%;
        height: 100%;
      }
      #panneau {
        position: absolute;
        left: 8px;
        bottom: 8px;
        padding: 8px 10px;
        border-radius: 6px;
        background: rgba(20, 24, 40, 0.8);
        color: #f3ead8;
        white-space: pre;
        pointer-events: none;
      }
      #panneau[hidden] {
        display: none;
      }
      #bandeau {
        position: absolute;
        right: 8px;
        top: 8px;
        padding: 4px 10px;
        border-radius: 6px;
        background: rgba(20, 24, 40, 0.75);
        color: #f3ead8;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="bandeau">Aubrune: aperçu en volumes simples (plan non validé)</div>
    <div id="panneau"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
