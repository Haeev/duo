# Gabarits des textures répétables de La Petite Ligne (refonte): sols, murs, toits, eau.
#
# Ajouter une texture = copier une entrée [[textures]] de même motif, changer `id`, `nom`,
# `matiere` et les paramètres voulus, puis lancer
#   bash games/la-petite-ligne-2/assets-src/textures/construire.sh
# Aucun code à écrire. Recette complète et note d'intégration: README.md de ce dossier.
#
# Style (vision définitive du client, 2026-11-10): « bande dessinée encrée ». Aplats peints à 2 ou
# 3 tons par matière (`tons`: clair, moyen, sombre), contours et joints à l'encre épais et
# irréguliers, éléments un peu de travers, ombres en taches plates et en hachures, herbe en touffes
# de traits sombres. Aucun bruit photographique, aucun relief réaliste, aucune brillance.
# Toutes les images sont calculées par nos scripts: aucune image existante n'est reprise.
#
# Unités: mètres. Une texture couvre la `taille` de sa famille; les éléments sont arrondis au
# nombre entier qui tient dedans (raccord sans couture). Les tailles obtenues sont écrites dans
# textures.json (`mesures_m`) et contrôlées (verifier_textures.py).
# Couleurs: noms de [couleurs] ou "#RRGGBB". Identifiants: anglais, minuscules et traits d'union.
# `palettes`: lieux pour lesquels décliner la texture (la première garde l'identifiant, les
# suivantes reçoivent le suffixe de [palettes.<lieu>]); par défaut, la palette de [reglages].

[reglages]
palette = "aubrune"
passe = 0.0           # aucun gris mêlé: les tons du gabarit sont déjà ceux de la bible
grain_peint = 0.0     # aucun bruit fin (style encré)
ombre_cuite = 0.0     # aucun relief cuit: les ombres sont dessinées en aplats et hachures
relief = 0.0
qualite = 88          # WebP de couleur (traits nets: pas en dessous de 85)
qualite_relief = 80

# ---------------------------------------------------------------- palettes par lieu
# Appliquées après le dessin: même motif, autre ambiance. `encre`: couleur des traits; `teinte` et
# `desature`: part de la couleur remplacée par sa clarté teintée; `clarte`: facteur final.
[palettes.aubrune]
nom = "Aubrune"
suffixe = "aubrune"
encre = "#2E2620"     # brun très sombre, plus doux qu'un noir pur sur des aplats clairs
clarte = 1.0

[palettes.hautefonte]
nom = "Hautefonte"
suffixe = "hautefonte"
encre = "#24252B"
teinte = "#CDD0D6"
desature = 0.3
clarte = 0.9

[palettes.combe-veilleuse]
nom = "Combe-Veilleuse"
suffixe = "combe"
encre = "#1C201F"
teinte = "#9DB2A9"
desature = 0.5
clarte = 0.7

# ---------------------------------------------------------------- familles (un atlas par famille)
# pixels: largeur x hauteur d'une couche; taille: mètres couverts (pixels carrés).
[familles.sols_exterieurs]
nom = "Sols extérieurs"
pixels = [512, 512]
taille = [4.0, 4.0]
relief = false

[familles.sols_interieurs]
nom = "Sols intérieurs"
pixels = [256, 256]
taille = [1.6, 1.6]
relief = false

[familles.murs_exterieurs]
nom = "Murs extérieurs"
pixels = [256, 256]
taille = [2.0, 2.0]
relief = false

[familles.toitures]
nom = "Toitures"
pixels = [256, 256]
taille = [2.0, 2.0]
relief = false

# ---------------------------------------------------------------- contrôles (verifier_textures.py)
[controles]
poids_max_mo = 6.0
raccord_max = 1.25        # écart au bord / plus grand écart entre colonnes voisines intérieures
derive_max = 1.5          # même mesure sur des bandes de 5 cm glissantes (dérive lente de clarté)
# contraste: le style encré est contrasté par nature (traits sombres sur aplats clairs). On borne
# l'écart-type de L* pour que la matière reste un fond derrière les personnages, et la clarté
# moyenne pour un jour tendre et clair à Aubrune (les autres lieux sont plus sombres)
ecart_type_l_max = 24.0
detail_l_max = 22.0
l_moyenne = [45.0, 88.0]
l_moyenne_lieu = { hautefonte = [38.0, 85.0], combe-veilleuse = [25.0, 70.0] }
# chaque matière prioritaire: au moins 2 variantes à Aubrune
matieres = ["herbe", "terre", "paves", "dalles", "plancher", "crepi", "pierre", "tuiles", "bardage", "eau"]
variantes_min = 2
[controles.echelles]
lame = [0.08, 0.14]
lame_large = [0.12, 0.30]   # fiches marquées `large = true`: plancher large, bardage
pave = [0.09, 0.16]
dalle = [0.30, 0.80]
tuile = [0.18, 0.30]
brique = [0.20, 0.26]

[couleurs]
trait_herbe = "#46602F"
trait_herbe_sec = "#6A6236"
trait_eau = "#3D6676"
mousse = "#8EA562"

