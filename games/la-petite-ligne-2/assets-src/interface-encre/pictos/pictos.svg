  Pictos de l'interface « à la plume » (grille 24). Un `<symbol id>` par picto, nommé comme
  l'appel `icon('<id>')`. Les traits (`fill="none"`) deviennent des traits de plume, plein et
  délié; une ombre en aplat s'écrit `fill="currentColor" fill-opacity=".3" data-w="0"`, du côté
  bas droit. Formes un peu de travers et trapues, jamais au compas.
  Ajouter un picto: copier un symbole, le renommer, dessiner, puis
  `NODE_PATH=/opt/node-tools/node_modules node assets-src/interface-encre/generer-images.mjs pictos`.
-->
