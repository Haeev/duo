# Gabarits des objets de La Petite Ligne (ce qu'on tient, ramasse, range, vend, mange).
#
# AJOUTER UN OBJET = copier une entrée [[objets]] de la même famille, changer `id`, `forme`,
# `taille` et `couleurs`, puis lancer `bash assets-src/objets/construire.sh` (moins de 10 s):
# il refait les GLB de `assets/commun/objets/`, l'index `index.json` et contrôle tout.
# Pour qu'un objet du jeu montre ce modèle, sa fiche `donnees/commun/objets/<id>.json` porte
# `"model": "<id du gabarit>"`. Sans modèle, le jeu montre une vignette générique « provisoire ».
#
# Champs communs
#   id        identifiant (= nom du nœud dans le GLB), minuscules et traits d'union
#   famille   une des familles ci-dessous: elle choisit le constructeur et le fichier GLB
#   forme     la variante de la famille (liste par famille ci-dessous)
#   taille    plus grande dimension de l'objet, en mètres (contrôlée à 12 % près)
#   couleurs  couleurs des pièces, par nom du nuancier (bible 2.4, `../personnages/nuancier.json`)
#             ou des couleurs d'Aubrune (bible 7.1, table [couleurs_lieu] plus bas).
#             Une clé absente prend la couleur par défaut de la famille.
#   pose      facultatif: "debout" (défaut) ou "couche" pour les objets longs posés à plat.
#
# Conventions de sortie: 1 unité = 1 m, Y en haut et avant vers +Z (glTF), origine au centre du
# dessous, un matériau `objet` mat pour tous, couleurs de sommets, normales lisses (bible 1.1:
# aucune facette). Chaque objet a un nœud enfant `<id>--grip`: là où la main le tient.

# Bornes de taille plausibles par famille (plus grande dimension, m) et triangles permis.
[familles]
fruit     = { min = 0.015, max = 0.40, defaut = { peau = "coquelicot", queue = "chocolat", feuille = "herbe" } }
legume    = { min = 0.04,  max = 0.50, defaut = { peau = "coquelicot", chair = "craie", feuille = "herbe" } }
poisson   = { min = 0.08,  max = 0.80, defaut = { dos = "olive", flanc = "perle", ventre = "craie", nageoire = "ficelle", oeil = "oeil", tache = "chocolat" } }
bocal     = { min = 0.06,  max = 0.25, defaut = { contenu = "prune", couvercle = "coquelicot", lien = "ficelle", etiquette = "craie" } }
bouteille = { min = 0.15,  max = 0.40, defaut = { contenu = "craie", bouchon = "noisette", etiquette = "lin" } }
pain      = { min = 0.06,  max = 0.70, defaut = { croute = "ocre", entaille = "lin" } }
plat      = { min = 0.10,  max = 0.35, defaut = { vaisselle = "craie", lisere = "bleu_de_travail", plat = "ocre", garniture = "herbe" } }
outil     = { min = 0.30,  max = 1.60, defaut = { manche = "noisette", tete = "acier", virole = "acier", lien = "cuir" } }
sac       = { min = 0.25,  max = 0.60, defaut = { toile = "lin", rabat = "noisette", sangle = "cuir", boucle = "laiton" } }
graine    = { min = 0.08,  max = 0.16, defaut = { papier = "lin", bande = "sauge", image = "coquelicot", feuille = "herbe" } }
fleur     = { min = 0.10,  max = 0.60, defaut = { petale = "coquelicot", coeur = "encre", tige = "herbe" } }
caillou   = { min = 0.04,  max = 0.25, defaut = { pierre = "pierre_creme", eclat = "acier" } }
bois      = { min = 0.25,  max = 1.30, defaut = { bois = "noisette", coeur = "lin" } }
courrier  = { min = 0.12,  max = 0.45, defaut = { papier = "craie", sceau = "coquelicot", ficelle = "ficelle", etiquette = "lin" } }
cle       = { min = 0.04,  max = 0.20, defaut = { metal = "laiton" } }
provision = { min = 0.08,  max = 0.30, defaut = { principale = "craie", secondaire = "lin", lien = "ficelle" } }
piece     = { min = 0.015, max = 0.06, defaut = { metal = "laiton" } }

[triangles]
min = 200
max = 800

# Couleurs d'Aubrune (bible 7.1), admises pour les objets en plus du nuancier des personnages.
[couleurs_lieu]
herbe = "#93B45E"
terre_claire = "#CFB489"
pierre_creme = "#C0B4A1"
lauze = "#737B86"
tuile = "#B86B4F"
enduit = "#EBDCBF"
volet = "#9B4C3B"
sauge_aubrune = "#7F9C79"
bleu_aubrune = "#7090A5"

