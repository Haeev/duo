# ---------------------------------------------------------------- pièces
# Champs communs: id, slot (body, head, hair, top, bottom, dress, shoes, hat, glasses, accessory), base (la forme
# de départ), zones (1 à 3: id, famille du nuancier, couleur par défaut), tags.
# Les sections du corps masquées (covers) sont déduites des longueurs: rien à remplir.

# --- base "torse": coque autour du buste. couche = décalage depuis la peau (0.019 près du corps, 0.021 pull,
# 0.034 par-dessus un haut); ourlet = distance sous la taille; manches = part du bras couverte (0 sans manches,
# 0.3 manche courte, 0.97 manche longue); ouverture = largeur de la fente de devant (0 = fermé);
# col = hauteur du col (1.337 ras du cou, 1.36 col roulé); bourrelet = bord renflé (vrai ou faux).
[[pieces]]
id = "top-tee"
slot = "top"
base = "torse"
couche = 0.019
ourlet = 0.06
manches = 0.3
ouverture = 0.0
col = 1.337
bourrelet = false
zones = [{ id = "principale", famille = "tissus", defaut = "moutarde" }]
tags = ["quotidien"]

[[pieces]]
id = "top-sweater"
slot = "top"
base = "torse"
couche = 0.021
ourlet = 0.09
manches = 0.97
ouverture = 0.0
col = 1.36
bourrelet = true
zones = [{ id = "principale", famille = "tissus", defaut = "ardoise" }]
tags = ["quotidien", "froid"]

[[pieces]]
