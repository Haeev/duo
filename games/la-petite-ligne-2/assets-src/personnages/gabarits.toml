slot = "accessory"
base = "veste"
couche = 0.028
ourlet = 0.035
pointes = 0.055
col = 1.336
col_v = 1.10
encolure = 0.064
emmanchure_bas = 1.055
boutons = 4
boutons_bas = 0.95
bouton = 0.012
poches = [[0.985, 1.0, 30, 9]]
poches_style = "passepoil"
couture_dos = true
martingale = true
zones = [{ id = "principale", famille = "tissus", defaut = "bouteille" }, { id = "boutons", famille = "fixes", couleurs = ["laiton", "cuir_sombre", "acier"], defaut = "laiton" }, { id = "dos", famille = "tissus", couleurs = ["anthracite", "encre", "perle", "chocolat", "marine", "lin"], defaut = "anthracite" }]
