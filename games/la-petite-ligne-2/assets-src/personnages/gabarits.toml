# Gabarits des personnages de La Petite Ligne (refonte).
#
# Ajouter une pièce, une coiffure ou une corpulence = copier une entrée ci-dessous, changer ses champs, puis lancer
#   bash games/la-petite-ligne-2/assets-src/personnages/construire.sh
# Aucun code à écrire. Recette en dix lignes: README.md de ce dossier.
#
# Unités: mètres. Repères de l'adulte: taille (ceinture) 0,983; entrejambe 0,80; genou 0,46; cheville 0,10;
# col 1,325; menton 1,36; sommet du crâne 1,70. Couleurs: noms du nuancier (nuancier.json, copie de la bible).
# Identifiants: minuscules, chiffres et traits d'union, emplacement en tête (top-tee).
# Chaque pièce a un `nom` français court (affiché dans l'éditeur et les boutiques).

# ---------------------------------------------------------------- corpulences (bible 2.1)
# sh carrure, wa taille, hi bassin, arm et leg épaisseur des membres; d_* profondeurs; belly avancée du ventre.
[corpulences.medium]
sh = 0.425
wa = 0.320
hi = 0.350
arm = 0.085
leg = 0.115
d_hi = 0.21
d_wa = 0.20
d_ch = 0.215
belly = 0.0

[corpulences.slim]
sh = 0.385
wa = 0.265
hi = 0.305
arm = 0.072
leg = 0.098
d_hi = 0.18
d_wa = 0.165
d_ch = 0.185
belly = 0.0

[corpulences.round]
sh = 0.455
wa = 0.430
hi = 0.440
arm = 0.100
leg = 0.138
d_hi = 0.29
d_wa = 0.33
d_ch = 0.27
belly = 0.035

# Silhouettes de départ: facteurs appliqués à la corpulence (épaules, taille, bassin). Toutes les pièces vont à tous.
[silhouettes.f]
sh = 0.93
wa = 0.90
hi = 1.07

[silhouettes.m]
sh = 1.05
wa = 1.02
hi = 0.95

# ---------------------------------------------------------------- morphologies
# build et silhouette: cibles de morphose à appliquer aux pièces. scale: échelle de tout le personnage.
