# ---------------------------------------------------------------- pièces
# Les couches (champ `couche`, décalage depuis la peau): chaque étage passe sur le précédent sans le percer.
#   1. près du corps: débardeur 0.017, t-shirt et robes 0.019, pull 0.021, gilet de laine 0.022;
#   2. gilet sans manches 0.028, salopette 0.026 à 0.027, bretelles jusqu'à 0.031 (par-dessus l'étage 1);
#   3. veste 0.036 (0.042 devant: elle tombe d'aplomb), par-dessus le gilet, la salopette et ses bretelles;
#   4. tablier 0.052, par-dessus tout.
# Les bas se portent sous les hauts (0.008 à 0.016), sauf la salopette. Écart conseillé entre deux étages:
# 4 mm au moins. Mariages sans solution propre (deux pièces du même étage): gilet sans manches et salopette,
# gilet sans manches et gilet de laine.
# Champs communs: id, slot (body, head, hair, top, bottom, dress, shoes, hat, glasses, accessory), base (la forme
# de départ), zones (1 à 3: id, famille du nuancier, couleur par défaut), tags.
# Les sections du corps masquées (covers) sont déduites des longueurs: rien à remplir.

# --- base "torse": coque autour du buste. couche = décalage depuis la peau (0.019 près du corps, 0.021 pull,
# 0.034 par-dessus un haut); ourlet = distance sous la taille; manches = part du bras couverte (0 sans manches,
# 0.3 manche courte, 0.97 manche longue); ouverture = largeur de la fente de devant (0 = fermé);
# col = hauteur du col (1.337 ras du cou, 1.36 col roulé); bourrelet = bord renflé (vrai ou faux).
[[pieces]]
