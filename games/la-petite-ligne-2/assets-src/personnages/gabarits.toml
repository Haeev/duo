# 1.265); emmanchure_bas = bas de l'emmanchure (1.14); bretelle_dehors et bretelle_dedans = hauteurs où les
# deux bords de la bretelle passent l'épaule (1.305 et 1.331: plus l'écart est grand, plus elle est large).
