# --- base "galet": chaussure en galet. tige = hauteur de la tige (0.10 chaussure basse, 0.24 botte);
# longueur du pied 0.24 chez l'adulte (bible 2.2). Zones: cuir puis semelle.
[[pieces]]
id = "shoes-pebble"
slot = "shoes"
base = "galet"
tige = 0.10
zones = [{ id = "cuir", famille = "fixes", couleurs = ["cuir", "cuir_sombre", "caoutchouc_clair"], defaut = "cuir_sombre" }, { id = "semelle", famille = "fixes", couleurs = ["semelle", "caoutchouc_clair"], defaut = "semelle" }]
