tags = ["pluie"]

# --- base "tete": crâne commun au-dessus de la ligne de chapeau, visage à 8 expressions (cibles de morphose).
# machoire = élargissement du bas du visage (0 rond, 0.1 carré); menton = allongement vers le bas;
# nez = taille du nez (1 = moyen); oreilles = taille des oreilles. Zones: sourcils, puis bouche (teinte claire
# pour les peaux sombres, bible 2.3).
[[pieces]]
id = "head-round"
slot = "head"
base = "tete"
machoire = 0.0
menton = 0.0
nez = 1.0
oreilles = 1.0
zones = [{ id = "sourcils", famille = "cheveux", defaut = "chatain" }, { id = "bouche", famille = "fixes", couleurs = ["bouche", "dent"], defaut = "bouche" }]
tags = ["doux"]

[[pieces]]
id = "head-square"
slot = "head"
base = "tete"
machoire = 0.10
menton = 0.012
nez = 1.35
oreilles = 1.2
zones = [{ id = "sourcils", famille = "cheveux", defaut = "noir" }, { id = "bouche", famille = "fixes", couleurs = ["bouche", "dent"], defaut = "bouche" }]
tags = ["marque"]

# --- base "coiffure": calotte sur le crâne et mèches en volumes.
# front = hauteur de la ligne des cheveux sur le front; nuque = hauteur de la ligne à l'arrière;
# meches = liste de volumes [x, y, z, rayon x, rayon y, rayon z, rot x, rot y, rot z] (y négatif = devant,
# rotations en degrés); miroir = vrai pour copier chaque mèche de l'autre côté (x opposé).
# Sous un chapeau, le jeu prend la variante « à plat » (calotte seule), fabriquée d'office.
