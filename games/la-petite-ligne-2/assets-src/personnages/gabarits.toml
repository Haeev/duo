# --- base "meshy-rigide": pièce générée par Meshy, déjà mise en place (dossier meshy/), tenue par un os.
# fichier = GLB conformé; os = os porteur; largeur = largeur finale; bas = hauteur du bord inférieur;
# cheveux = effet sur la coiffure: "free" (rien), "flat" (variante à plat), "hidden" (coiffure retirée).
