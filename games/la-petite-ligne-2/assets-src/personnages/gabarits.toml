# --- base "veste": coque ouverte posée sur le buste (gilets, cardigans, vestes). Champs de "torse" (couche,
# ourlet, col, manches) et en plus: col_v = hauteur du bas de l'encolure en V (absent: ras du cou);
# encolure = demi-largeur du V en haut; ouverture = largeur du devant ouvert sur toute la hauteur;
# pointes = descente de l'ourlet en pointe sur le devant; emmanchure = trous de bras quand manches = 0
# (largeur gardée à l'épaule = demi-carrure - emmanchure x bras, 0.55 par défaut, 0 sans trou); bande = hauteur des côtes en bas et aux poignets (0: aucune); boutons = nombre;
# poches = liste [bas, haut, angle depuis le milieu du devant en degrés, demi-largeur en degrés];
# revers = col rabattu et revers sur le V; martingale = demi-ceinture et boucle dans le dos.
# Zones: principale, puis boutons (couleurs fixes), puis dos facultatif (dos d'une autre étoffe).
# Gilet refait le 2026-11-11 (retour du client: l'ancien, une coque en boîte, était « hideux »): même id.
