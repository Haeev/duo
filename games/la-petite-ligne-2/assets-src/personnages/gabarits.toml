# Gabarits des personnages de La Petite Ligne (refonte).
#
# Ajouter une pièce, une coiffure ou une corpulence = copier une entrée ci-dessous, changer ses champs, puis lancer
#   bash games/la-petite-ligne-2/assets-src/personnages/construire.sh
# Aucun code à écrire. Recette en dix lignes: README.md de ce dossier.
#
# Unités: mètres. Repères de l'adulte: taille (ceinture) 0,983; entrejambe 0,80; genou 0,46; cheville 0,10;
# col 1,325; menton 1,36; sommet du crâne 1,70. Couleurs: noms du nuancier (nuancier.json, copie de la bible).
# Identifiants: minuscules, chiffres et traits d'union, emplacement en tête (top-tee).
# Chaque pièce a un `nom` français court (affiché dans l'éditeur et les boutiques).

