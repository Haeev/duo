# --- base "veste": coque ouverte posée sur le buste (gilets, cardigans, vestes). Champs de "torse" (couche,
# ourlet, col, manches) et en plus: col_v = hauteur du bas de l'encolure en V (absent: ras du cou);
# encolure = demi-largeur du V en haut; ouverture = largeur du devant ouvert sur toute la hauteur;
# pointes = descente de l'ourlet en pointe sur le devant; emmanchure = trous de bras quand manches = 0
# (largeur gardée à l'épaule = demi-carrure - emmanchure x bras, 0.55 par défaut, 0 sans trou); bande = hauteur des côtes en bas et aux poignets (0: aucune); boutons = nombre;
# poches = liste [bas, haut, angle depuis le milieu du devant en degrés, demi-largeur en degrés], plaquées et
# cernées d'un trait, ou poches_style = "passepoil" (une fente: un trait en biais); poches_saillie = relief;
# revers = col rabattu en pointes et revers sur le V, bordés d'un trait (col_largeur 0.045, col_pointe 0.04,
# revers_largeur 0.05); martingale = demi-ceinture cernée et boucle dans le dos (martingale_haut = hauteur
# au-dessus de la taille); couture_dos = couture du milieu du dos, à l'encre; emmanchure_bas = bas du trou de
# bras (1.04); bouton = rayon (0.011), bouton_saillie = son relief (0.004), boutons_bas = hauteur du dernier;
# cotes = relief des côtes (0.004);
# tombe = décalage de plus sur le devant (veste qui tombe d'aplomb, 0); droit = sous les hanches la veste
# descend droit au lieu de rentrer sous le bassin; couche_manches = décalage des manches (0.85 x couche).
# Zones: principale, puis boutons (couleurs fixes), puis dos facultatif (dos d'une autre étoffe).
# Les détails qui doivent se lire (couture, poche, bord de col) sont des traits d'encre en géométrie
# (teinte fixe `encre_trait`): le trait du rendu ne cerne que les silhouettes et les arêtes vives.
# Gilet refait le 2026-11-11 (retour du client: l'ancien, une coque en boîte, était « hideux »), puis repris le
# même jour (dos arrêté à la taille, couture, martingale nette, emmanchures): même id.
