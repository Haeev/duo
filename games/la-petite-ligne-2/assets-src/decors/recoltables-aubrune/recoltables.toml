# Récoltables d'Aubrune: tout ce qu'on récolte et tout ce qui pousse dehors (style encré, campagne).
#
# Ajouter un modèle = copier une entrée [[modeles]] de la même famille, changer `id` et les champs
# voulus, puis lancer
#   bash games/la-petite-ligne-2/assets-src/decors/recoltables-aubrune/construire.sh
# Aucun code à écrire. Recette complète: README.md de ce dossier.
#
# Unités: mètres. Origine au pied du modèle, au centre de son emprise. Identifiants en anglais,
# minuscules et traits d'union. Un modèle engendre ses variantes (`<id>-b`) et ses états
# (`<id>-stump`, `<id>-bare`, `<id>-winter`...), inscrits au manifeste sous `variants` et `states`.

lieu = "aubrune"

# ---------------------------------------------------------------- fichiers et budgets par famille
[fichiers]
arbre = "aubrune-arbres"
buisson = "aubrune-recoltes"
rocher = "aubrune-recoltes"
fleur = "aubrune-recoltes"
bois = "aubrune-recoltes"
repere = "aubrune-recoltes"
culture = "aubrune-potager"
parcelle = "aubrune-potager"
haie = "aubrune-lisieres"
talus = "aubrune-lisieres"
rang = "aubrune-lisieres"
meuble = "aubrune-meubles"
luminaire = "aubrune-luminaires"
ouvrage = "aubrune-ouvrages"
objet = "aubrune-objets"
vehicule = "aubrune-trains"
fete = "aubrune-fetes"
voie = "aubrune-lisieres"
mobilier = "aubrune-mobilier"

# Plafonds de triangles. Culture: par plant (`plants` du manifeste), le modèle est une case de 1 m.
[budgets]
arbre = 1200
arbre_far = 520
arbre_shade = 220
buisson = 300
rocher = 300
fleur = 200
bois = 300
repere = 200
culture = 150
parcelle = 220
potager = 800
# Modules répétés case par case sur de longues files (233 cases de haie, 144 de berge): très légers.
haie = 60
talus = 60
rang = 60
meuble = 600
luminaire = 300
ouvrage = 2500
# Objets d'intérieur: 150 (300 pour les gros, `budget` de l'entrée). Un train: 2 500 par véhicule.
objet = 150
vehicule = 2500
# Décor des fêtes (meubles du dehors posés un jour de fête): comme un meuble.
fete = 600
# Voie en tranchée: module de 1 m le long de la voie, mais large (ballast, fossés, talus).
voie = 240
# Mobilier repris de l'ancienne chaîne (lits, armoire, voiture du train...): `mobilier.py`.
mobilier = 900

# ---------------------------------------------------------------- matériaux (noms stables)
# Le rendu encré tire du NOM la couche de traits et la prise au vent (`nature`: leaf = feuillage
# qui plie et frémit, stem = tige qui plie). Recopié tel quel dans le manifeste (`materials`).
[materiaux]
feuillage = { couche = "leaf", nature = "leaf" }
ecorce = { couche = "bark", nature = "stem" }  # tronc vivant: il plie avec son houppier
bois = { couche = "grain" }                    # bois mort ou coupé: souche, bûche, piquet
pierre = { couche = "face" }
mousse = { couche = "leaf" }
terre = { couche = "dirt" }
tige = { couche = "plain", nature = "stem" }
fruit = { couche = "plain", nature = "stem" }  # il suit la branche qui le porte
fleur = { couche = "plain", nature = "stem" }
# Aménagements: mêmes noms et mêmes couches que les bâtiments d'Aubrune (INK_SETTINGS.materials).
gazon = { couche = "grass" }                   # dessus d'un talus: l'herbe du pré continue
moellon = { couche = "slab" }                  # maçonnerie appareillée (pile, portail)
crepi = { couche = "wall" }
tuile = { couche = "roof" }
bardage = { couche = "wood" }                  # planches jointives (poulailler)
metal = { couche = "plain" }
vitre = { couche = "plain" }                   # verre, glace, bocaux
etoffe = { couche = "plain" }
flamme = { couche = "plain", nature = "fire" }   # langue de feu (finit en pointe): elle ondule; sinon verre d'une lampe qui luit allumée
braise = { couche = "plain", nature = "ember" }  # braises: elles rougeoient lentement
vitrage = { couche = "plain", nature = "flame" }  # fenêtres d'une voiture de voyageurs: allumées avec les lampes

