# ---------------------------------------------------------------- buissons et ronces
# `forme`: "fourre" (ronce: coeur bas, longues tiges arquées qui retombent au sol, épines, feuilles
# à trois ou cinq folioles, mûres en grappes) ou "boule" (buisson à baies).
[[modeles]]
id = "bramble"
famille = "buisson"
forme = "fourre"
feuillage = "feuille_ronce"
# Mûres: une grappe de 4 ou 5 sur le haut d'un arc (`nombre` grappes), noires et rouges.
fruits = { teinte = "mure", nombre = 6, rayon = 0.037 }
tiges = 6
rayon = 0.6
hauteur = 0.72
graine = 131
# Tiges, épines et feuilles composées tout le long des arcs: plus qu'un buisson rond.
budget = 1500
variantes = [{ suffixe = "b", graine = 149, taille = 0.92 }]
etats = ["bare"]
# Plus grande que la famille: à 18 m de vue, un fourré de 1,4 m se perdait dans l'herbe.
