sauge = "#7F9C79"
bleu = "#7090A5"
ambre = "#FFC874"
miel = "#C99A5B"
creme = "#EFE4CC"
bois_brut = "#A9825A"
bois_clair = "#D9B98A"
bois_gris = "#8E8579"
bois_sombre = "#6B4A33"
vert_sombre = "#3F6453"
noir_doux = "#34312F"
fonte = "#3E4743"
laiton = "#C8A150"
acier = "#8C8E91"
vitre = "#9DB9C4"
eau = "#7FA9B8"
eau_sombre = "#4F7584"
terre_cuite = "#C07A55"
ecorce = "#7A5A3F"
feuillage = "#6F9650"
