# ---------------------------------------------------------------- végétation
# Arbres, buissons, fleurs et souches du dehors: `recoltables-aubrune/recoltables.toml` (style
# encré, états et variantes). Les familles `arbre`, `buisson`, `touffe`, `fleurs` et `souche`
# d'ici n'ont plus de modèle.

# ---------------------------------------------------------------- maisons (famille paramétrique)
# largeur (X, est-ouest) et profondeur (Y) = emprise des murs; etages = niveaux pleins;
# toit: "deux-pans" (faîtage le long du grand côté), "croupe", "appentis"; pente en degrés.
# portes: [{ facade = "sud" | "nord" | "est" | "ouest", position = 0 à 1 depuis la gauche vue de dehors }]
# fenetres: { facade = nombre par niveau } (pas de fenêtre sur une porte au rez-de-chaussée).
# devanture: { facade, largeur, position } (vitrine, porte, enseigne, store).
[defauts.maison.couleurs]
murs = "enduit"
toit = "tuile"
menuiseries = "creme"
volets = "rouge_cheminot"
porte = "rouge_cheminot"
soubassement = "pierre"
vitre = "vitre"
metal = "fonte"
enseigne = "marine"
store = "coquelicot"

[[modeles]]
id = "house-town"              # maison de bourg (6 x 6 du plan, porte au sud), un étage sur rez-de-chaussée
famille = "maison"
largeur = 7.0
profondeur = 6.0
etages = 2
toit = "deux-pans"
pente = 40
portes = [{ facade = "sud", position = 0.5 }]
fenetres = { sud = 3, nord = 2, est = 1, ouest = 1 }

[[modeles]]
id = "shop-front"              # boutique (épicerie 8 x 10, vitrine et porte vers la place)
famille = "maison"
largeur = 8.0
profondeur = 10.0
etages = 2
toit = "croupe"
pente = 35
devanture = { facade = "sud", largeur = 4.2, position = 0.5 }
portes = [{ facade = "nord", position = 0.3 }]
fenetres = { sud = 3, nord = 2, est = 2, ouest = 2 }
couleurs = { murs = "enduit_ocre", toit = "lauze", volets = "vert_sombre", porte = "vert_sombre", menuiseries = "vert_sombre", enseigne = "vert_sombre", store = "moutarde" }

[[modeles]]
id = "shed"                    # remise (draisine: 6 x 5, porte à l'ouest dans l'axe des rails)
famille = "maison"
largeur = 6.0
profondeur = 5.0
etages = 1
hauteur_etage = 3.0
toit = "appentis"
pente = 14
cheminee = false
volets = false
portes = [{ facade = "ouest", position = 0.5 }]
fenetres = { sud = 1 }
couleurs = { murs = "bois_gris", toit = "lauze", menuiseries = "bois_sombre", porte = "bois_brut", soubassement = "pierre" }

# ---------------------------------------------------------------- voiture de train de nuit (intérieur)
# Une voiture se monte avec des pans de 1 m (paroi à fenêtre, paroi pleine, porte) posés au bord
# avant de leur case, des angles aux quatre coins, puis le mobilier (banquettes face à face par
# travée, tablette entre elles, filets à bagages, appliques). Couleurs: bois = boiseries, peinture =
# haut des parois, tissu = velours et lambrequins, metal = laiton; `caisse` = peinture du dehors.
[[modeles]]
id = "train-wall-window"       # pan de 1 m: allège boisée, fenêtre (la nuit et deux reflets), lambrequin
famille = "paroi-voiture"
couleurs = { bois = "noisette", peinture = "creme", tissu = "brique" }

[[modeles]]
id = "train-wall"              # pan plein (bout de voiture)
famille = "paroi-voiture"
fenetre = false
couleurs = { bois = "noisette", peinture = "creme" }

[[modeles]]
id = "train-wall-map"          # pan plein avec le plan de la ligne encadré (bout du couloir)
famille = "paroi-voiture"
fenetre = false
cadre = true
couleurs = { bois = "noisette", peinture = "creme" }

[[modeles]]
id = "train-wall-corner"       # montant d'angle de caisse
famille = "angle-caisse"

[[modeles]]
id = "train-door"              # porte de voiture: vantail boisé à hublot, poignée de laiton, seuil
famille = "porte-voiture"
couleurs = { bois = "noisette", peinture = "creme", metal = "laiton" }

[[modeles]]
id = "train-seat"              # banquette de deux places, velours brique, têtières blanches
famille = "banquette-train"
couleurs = { bois = "noisette", tissu = "brique" }

[[modeles]]
id = "train-berth"             # deux banquettes tirées en couchette: oreiller, couverture moutarde
famille = "couchette-train"
couleurs = { bois = "noisette", tissu = "brique" }

[[modeles]]
id = "train-table"             # tablette fixée sous la fenêtre, pied central
famille = "tablette"
couleurs = { bois = "miel", metal = "laiton" }

[[modeles]]
id = "train-luggage-rack"      # filet à bagages de 2,6 m et les deux valises des voyageurs
famille = "porte-bagages"
couleurs = { bois = "miel", metal = "laiton" }
valises = [[-0.55, 0.62, 0.28, 0.20, "rouille"], [0.25, 0.54, 0.26, 0.18, "canard"]]

[[modeles]]
id = "train-luggage-rack-empty" # même filet, vide
famille = "porte-bagages"
couleurs = { bois = "miel", metal = "laiton" }

[[modeles]]
id = "train-wall-lamp"         # applique: platine de laiton, tulipe ambrée
famille = "applique"
couleurs = { metal = "laiton" }
