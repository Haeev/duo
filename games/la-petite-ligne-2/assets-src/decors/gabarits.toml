# Gabarits des décors de La Petite Ligne (refonte): meubles, mobilier de lieu, végétation, maisons.
#
# Ajouter un décor = copier une entrée [[modeles]] de la même famille, changer `id` et les champs voulus,
# puis lancer
#   bash games/la-petite-ligne-2/assets-src/decors/construire.sh
# Aucun code à écrire. Recette complète: README.md de ce dossier.
#
# Unités: mètres. Repère: origine au centre de l'emprise, au sol; l'avant regarde le sud (+Z glTF).
# Cotes humaines contrôlées (verifier_decors.py): assise 0,45, plateau 0,75 (table), porte de 2 m et plus.
# Couleurs: noms de [couleurs] ci-dessous, ou des tissus du nuancier des personnages (nuancier.json).
# Emplacements de couleur d'un meuble (bible 7.4): bois, peinture, tissu, metal. Une couleur nommée
# directement (ex. "pierre") est fixe. Identifiants: anglais, minuscules et traits d'union.

# ---------------------------------------------------------------- nuancier des décors (bible 7.1 et 7.4)
[couleurs]
herbe = "#93B45E"
terre = "#CFB489"
pierre = "#C0B4A1"
pierre_claire = "#D6CCBB"
lauze = "#737B86"
tuile = "#B86B4F"
enduit = "#EBDCBF"
enduit_rose = "#E8C9B4"
enduit_ocre = "#E2C48E"
rouge_cheminot = "#9B4C3B"
sauge = "#7F9C79"
bleu = "#7090A5"
ambre = "#FFC874"
miel = "#C99A5B"
creme = "#EFE4CC"
bois_brut = "#A9825A"
bois_clair = "#D9B98A"
bois_gris = "#8E8579"
bois_sombre = "#6B4A33"
vert_sombre = "#3F6453"
noir_doux = "#34312F"
fonte = "#3E4743"
laiton = "#C8A150"
acier = "#8C8E91"
vitre = "#9DB9C4"
eau = "#7FA9B8"
eau_sombre = "#4F7584"
terre_cuite = "#C07A55"
